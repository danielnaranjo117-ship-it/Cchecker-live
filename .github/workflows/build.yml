          cat > lib/logo.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'theme.dart';

          class LogoMark extends StatelessWidget {
            const LogoMark({super.key, this.size = 30});
            final double size;

            @override
            Widget build(BuildContext context) =>
                SizedBox(width: size, height: size, child: CustomPaint(painter: _LogoPainter()));
          }

          class _LogoPainter extends CustomPainter {
            @override
            void paint(Canvas canvas, Size s) {
              final w = s.width;
              final h = s.height;
              final full = Rect.fromLTWH(0, 0, w, h);

              canvas.drawRRect(
                RRect.fromRectAndRadius(full, Radius.circular(w * 0.28)),
                Paint()
                  ..shader = const LinearGradient(
                    begin: Alignment.topCenter,
                    end: Alignment.bottomCenter,
                    colors: [Color(0xFF0B0D18), Color(0xFF161E34)],
                  ).createShader(full),
              );

              canvas.drawPath(_shield(w, h), Paint()..shader = brandGradient.createShader(full));
              canvas.drawPath(_shield(w, h, inset: 0.13), Paint()..color = const Color(0xFF0B0D18));

              final check = Path()
                ..moveTo(w * 0.33, h * 0.51)
                ..lineTo(w * 0.45, h * 0.64)
                ..lineTo(w * 0.68, h * 0.38);

              canvas.drawPath(
                check,
                Paint()
                  ..color = AppColors.lime
                  ..style = PaintingStyle.stroke
                  ..strokeWidth = w * 0.085
                  ..strokeCap = StrokeCap.round
                  ..strokeJoin = StrokeJoin.round,
              );
            }

            Path _shield(double w, double h, {double inset = 0}) {
              final l = w * (0.08 + inset);
              final r = w * (0.92 - inset);
              final t = h * (0.06 + inset);
              final b = h * (0.96 - inset);
              final sh = h * (0.30 + inset * 0.4);
              return Path()
                ..moveTo(w * 0.5, t)
                ..lineTo(r, sh)
                ..lineTo(r, h * 0.55)
                ..quadraticBezierTo(r, b - h * 0.12, w * 0.5, b)
                ..quadraticBezierTo(l, b - h * 0.12, l, h * 0.55)
                ..lineTo(l, sh)
                ..close();
            }

            @override
            bool shouldRepaint(covariant _LogoPainter old) => false;
          }
          DART

          cat > lib/widgets.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'theme.dart';

          class GlassPanel extends StatelessWidget {
            const GlassPanel({super.key, required this.child, this.padding = const EdgeInsets.all(16)});
            final Widget child;
