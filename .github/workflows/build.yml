              if (code == 'transaction_not_allowed') return r(CheckStatus.restricted, 'sin compras online');
              if (code == 'card_not_supported') return r(CheckStatus.restricted, 'tipo no soportado');
              if (code == 'currency_not_supported') return r(CheckStatus.restricted, 'moneda no soportada');
              if (decline == 'do_not_honor' || decline == 'generic_decline') return r(CheckStatus.restricted, 'emisor la bloquea');
              if (decline == 'no_such_issuer') return r(CheckStatus.dead, 'emisor inexistente');
              if (decline == 'lost_card') return r(CheckStatus.dead, 'reportada perdida');
