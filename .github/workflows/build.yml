              final String body;
              final String name;

              switch (format) {
                case 'json':
                  body = const JsonEncoder.withIndent('  ').convert(all.map((c) => c.toJson()).toList());
                  name = 'boveda.json';
                  break;
                case 'txt':
                  body = all.map((c) => c.line).join('\n');
                  name = 'boveda.txt';
