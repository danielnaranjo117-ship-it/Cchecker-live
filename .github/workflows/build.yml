          class BinDb {
            BinDb._();
            static final BinDb i = BinDb._();

            static const sources = [
              'https://raw.githubusercontent.com/iannuttall/binlist-data/master/binlist-data.csv',
              'https://raw.githubusercontent.com/venelinkochev/bin-list-data/master/bin-list-data.csv',
            ];

            Map<String, BinInfo> _map = {};

            int get count => _map.length;
            bool get ready => _map.isNotEmpty;

            Future<File> _file() async {
              final dir = await getApplicationDocumentsDirectory();
              return File('${dir.path}/bin_list.csv');
            }

            Future<File> _index() async {
              final dir = await getApplicationDocumentsDirectory();
              return File('${dir.path}/bin_index.json');
            }

            Future<bool> installed() async => (await _index()).exists();

            static List<String> _csvRow(String line) {
              final out = <String>[];
              final b = StringBuffer();
              var q = false;
              for (var i = 0; i < line.length; i++) {
                final c = line[i];
                if (q) {
                  if (c == '"') {
                    if (i + 1 < line.length && line[i + 1] == '"') {
                      b.write('"');
                      i++;
                    } else {
                      q = false;
                    }
                  } else {
                    b.write(c);
                  }
                } else if (c == '"') {
                  q = true;
                } else if (c == ',') {
                  out.add(b.toString());
                  b.clear();
                } else {
                  b.write(c);
                }
              }
              out.add(b.toString());
              return out;
            }

            Future<void> download({void Function(int received, int total)? onProgress, List<String>? urls}) async {
              final f = await _file();
              final tmp = File('${f.path}.part');
              Object? lastErr;

              for (final url in (urls ?? sources)) {
                final client = http.Client();
                IOSink? sink;
                try {
                  final res = await client.send(http.Request('GET', Uri.parse(url)));
                  if (res.statusCode != 200) throw HttpException('HTTP ${res.statusCode}');
                  final total = res.contentLength ?? 0;
                  var received = 0;
                  sink = tmp.openWrite();
                  await for (final part in res.stream) {
                    sink.add(part);
                    received += part.length;
                    onProgress?.call(received, total);
                  }
                  await sink.flush();
                  await sink.close();
                  sink = null;
                  if (await f.exists()) await f.delete();
                  await tmp.rename(f.path);
                  return;
                } catch (e) {
                  lastErr = e;
                  try {
                    await sink?.close();
                  } catch (_) {}
                } finally {
                  client.close();
                }
              }
              throw Exception('descarga fallida: $lastErr');
            }

            Future<int> installFrom(String url, {void Function(int lines)? onProgress}) async {
              await download(urls: <String>[url]);
              return buildIndex(onProgress: onProgress);
            }

            Future<int> buildIndex({void Function(int lines)? onProgress}) async {
              final f = await _file();
              if (!await f.exists()) return 0;

              final map = <String, BinInfo>{};
              var cBin = 0, cBrand = 1, cType = 2, cCat = 3, cIssuer = 4, cA2 = 5;
              var lineNo = 0;

              final stream = f.openRead().transform(utf8.decoder).transform(const LineSplitter());
              await for (final line in stream) {
                if (line.isEmpty) continue;
                final c = _csvRow(line);
                lineNo++;

                if (lineNo == 1) {
                  final h = c.map((e) => e.trim().toLowerCase()).toList();
                  int find(List<String> names) {
                    for (final n in names) {
                      final i = h.indexOf(n);
                      if (i >= 0) return i;
                    }
                    return -1;
                  }

                  final b = find(['bin', 'iin', 'bin_iin']);
                  if (b >= 0) cBin = b;
                  final br = find(['brand', 'scheme', 'network']);
                  if (br >= 0) cBrand = br;
                  final ty = find(['type', 'card_type']);
                  if (ty >= 0) cType = ty;
                  final ca = find(['category', 'level', 'card_level']);
                  if (ca >= 0) cCat = ca;
                  final iss = find(['issuer', 'bank', 'bank_name']);
                  if (iss >= 0) cIssuer = iss;
                  final a2 = find(['alpha_2', 'country_code', 'iso']);
                  if (a2 >= 0) cA2 = a2;
                  continue;
                }

                if (lineNo % 20000 == 0) {
                  onProgress?.call(lineNo);
                  await Future<void>.delayed(Duration.zero);
                }

                if (c.length <= cBin) continue;
                final bin = c[cBin].trim();
                if (bin.length < 4 || bin.length > 8) continue;

                map[bin] = BinInfo(
                  bank: c.length > cIssuer ? c[cIssuer].trim() : '',
                  country: c.length > cA2 ? c[cA2].trim().toUpperCase() : '',
                  cardType: c.length > cType ? c[cType].trim().toLowerCase() : '',
                  level: c.length > cCat ? c[cCat].trim().toLowerCase() : '',
                );
              }

              _map = map;
              final idx = await _index();
              await idx.writeAsString(jsonEncode(map.map((k, v) => MapEntry(k, v.toJson()))), flush: true);
              return map.length;
            }

            Future<void> loadIndex() async {
              if (_map.isNotEmpty) return;
              final idx = await _index();
              if (!await idx.exists()) return;
              try {
                final txt = await idx.readAsString();
                final j = jsonDecode(txt) as Map<String, dynamic>;
                _map = j.map((k, v) => MapEntry(k, BinInfo.fromJson((v as Map).cast<String, dynamic>())));
              } catch (_) {
                _map = {};
              }
            }

            BinInfo? lookup(String pan) {
              final d = pan.replaceAll(RegExp(r'\D'), '');
              for (var len = 6; len >= 4; len--) {
                if (d.length < len) continue;
                final hit = _map[d.substring(0, len)];
                if (hit != null) return hit;
              }
              return null;
            }

            Future<void> drop() async {
              _map = {};
              for (final f in [await _file(), await _index()]) {
                if (await f.exists()) await f.delete();
              }
            }
          }
