          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';

          import '../bin_db.dart';
          import '../bin_gen.dart';
          import '../core.dart';
          import '../import_engine.dart';
          import '../models.dart';
          import '../providers.dart';
          import '../theme.dart';
          import '../widgets.dart';

          class ImportScreen extends ConsumerStatefulWidget {
            const ImportScreen({super.key});
            @override
            ConsumerState<ImportScreen> createState() => _ImportScreenState();
          }

          class _ImportScreenState extends ConsumerState<ImportScreen> {
            final _ctrl = TextEditingController();
            final _genBin = TextEditingController(text: '424242');
            ImportResult? _res;
            bool _enrich = true;
            bool _repair = true;
            bool _busy = false;
            String _progress = '';
            double _genCount = 25;
            double _genLen = 16;

            @override
            void dispose() {
              _ctrl.dispose();
              _genBin.dispose();
              super.dispose();
            }

            void _parse() => setState(() => _res = parseCards(_ctrl.text, repairLuhn: _repair));

            void _generate() {
              final cards = generateCards(GenSpec(bin: _genBin.text, count: _genCount.round(), length: _genLen.round()));
              if (cards.isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('BIN muy corto')));
                return;
              }
              setState(() => _res = ImportResult(cards: cards));
            }

            Future<void> _commit({required bool andRun}) async {
              final res = _res;
              if (res == null) return;

              setState(() {
                _busy = true;
                _progress = '';
              });

              await BinDb.i.loadIndex();

              var done = 0;
              final enriched = <CreditCard>[];

              for (final c in res.cards) {
                if (_enrich) {
                  final info = BinDb.i.lookup(c.pan);
                  enriched.add(
                    info == null
                        ? c
                        : c.copyWith(bank: info.bank, country: info.country, cardType: info.cardType, level: info.level),
                  );
                } else {
                  enriched.add(c);
                }
                done++;
                if (done % 500 == 0) {
                  if (mounted) setState(() => _progress = '$done/${res.cards.length}');
                  await Future<void>.delayed(Duration.zero);
                }
              }

              await ref.read(cardsProvider.notifier).addAll(enriched);

              if (!mounted) return;
              setState(() {
                _busy = false;
                _progress = '';
                _ctrl.clear();
                _res = null;
              });

              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text('${res.cards.length} tarjetas agregadas')));

              if (andRun) {
                ref.read(tabProvider.notifier).state = 0;
                await ref.read(runProvider.notifier).run(ids: enriched.map((c) => c.id).toList());
              }
            }

            @override
            Widget build(BuildContext context) {
              final res = _res;

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Pega las lineas'),
                  GlassPanel(
                    child: TextField(
                      controller: _ctrl,
                      maxLines: 10,
                      style: AppTextStyles.mono,
