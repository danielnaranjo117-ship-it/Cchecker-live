            static String bodyToText(String body) {
              final t = body.trimLeft();

              if (t.startsWith('{') || t.startsWith('[')) {
                try {
                  final b = StringBuffer();
                  _walk(jsonDecode(body), b);
                  final out = b.toString();
                  if (out.trim().isNotEmpty) return out;
                } catch (_) {}
              }

              if (t.contains('<') && t.contains('>')) return htmlToText(body);
              return body;
            }

            static void _walk(Object? node, StringBuffer b) {
              if (node == null) return;
              if (node is Map) {
                for (final v in node.values) {
                  _walk(v, b);
                }
              } else if (node is List) {
                for (final v in node) {
                  _walk(v, b);
                }
