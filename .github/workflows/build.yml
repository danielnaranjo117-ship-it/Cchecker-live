name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Preparar proyecto
        run: |
          set -e
          echo "=== CCheker Live v7.1 ==="
          flutter create --org com.cchekerx --project-name ccheker_live --platforms android ccheker_live
          cd ccheker_live
          rm -rf lib test
          mkdir -p lib/screens
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Icono
        run: |
          cd ccheker_live
          cat > /tmp/icon.py <<'PY'
          import math, struct, zlib, os

          SIZES = [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]

          def chunk(t, d):
              return struct.pack('>I', len(d)) + t + d + struct.pack('>I', zlib.crc32(t + d) & 0xffffffff)

          def dseg(px, py, ax, ay, bx, by):
              vx, vy = bx - ax, by - ay
              wx, wy = px - ax, py - ay
              L = vx * vx + vy * vy
              t = 0.0 if L == 0 else max(0.0, min(1.0, (wx * vx + wy * vy) / L))
              return math.hypot(px - (ax + vx * t), py - (ay + vy * t))

          def make(path, s):
              raw = bytearray()
              w = 0.072 * s
              for y in range(s):
                  raw.append(0)
                  for x in range(s):
                      f = y / (s - 1.0)
                      r = int(9 + 10 * f); g = int(11 + 12 * f); b = int(17 + 16 * f)
                      d = min(dseg(x, y, 0.25 * s, 0.53 * s, 0.43 * s, 0.71 * s),
                              dseg(x, y, 0.43 * s, 0.71 * s, 0.77 * s, 0.31 * s))
                      if d < w:
                          a = 1.0 if d < w - 1.5 else (w - d) / 1.5
                          r = int(r * (1 - a) + 186 * a)
                          g = int(g * (1 - a) + 255 * a)
                          b = int(b * (1 - a) + 84 * a)
                      raw += bytes((r, g, b))
              ihdr = struct.pack('>IIBBBBB', s, s, 8, 2, 0, 0, 0)
              data = b'\x89PNG\r\n\x1a\n' + chunk(b'IHDR', ihdr) + chunk(b'IDAT', zlib.compress(bytes(raw), 9)) + chunk(b'IEND', b'')
              os.makedirs(os.path.dirname(path), exist_ok=True)
              open(path, 'wb').write(data)

          for name, s in SIZES:
              make('android/app/src/main/res/mipmap-%s/ic_launcher.png' % name, s)
          print('icono listo')
          PY
          python3 /tmp/icon.py

      - name: Parche Android
        run: |
          cd ccheker_live
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <application|' "$MAN"
          sed -i 's|android:label="ccheker_live"|android:label="CCheker Live"|' "$MAN" || true

          MA=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n1)
          PKG=$(echo "$MA" | sed 's|android/app/src/main/kotlin/||; s|/MainActivity.kt||; s|/|.|g')
          cat > "$MA" <<KT
          package $PKG

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          KT

          GR=android/app/build.gradle
          sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$GR" || true
          sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk 23/' "$GR" || true
          sed -i -E 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/' "$GR" || true
          sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk 35/' "$GR" || true

          for g in $(find "$HOME/.pub-cache" -path '*android/build.gradle' 2>/dev/null); do
            if grep -q "namespace" "$g"; then continue; fi
            d=$(dirname "$g")
            kt=$(find "$d/src/main" -name '*.kt' 2>/dev/null | head -n1)
            if [ -z "$kt" ]; then continue; fi
            pkg=$(grep -m1 '^package ' "$kt" | sed 's/package //; s/;//; s/[[:space:]]//g')
            if [ -z "$pkg" ]; then continue; fi
            sed -i "0,/^android {/s||android {\n    namespace '$pkg'|" "$g"
          done
          echo "android parcheado"

      - name: Escribir codigo
        run: |
          cd ccheker_live

          cat > pubspec.yaml <<'YAML'
          name: ccheker_live
          description: Checker masivo con boveda cifrada, autorizacion real y buscador de fuentes.
          publish_to: 'none'
          version: 7.1.0+21

          environment:
            sdk: '>=3.5.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            shared_preferences: ^2.2.3
            http: ^1.2.1
            crypto: ^3.0.3
            encrypt: ^5.0.3
            path_provider: ^2.1.4
            share_plus: ^7.2.1
            local_auth: ^2.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          YAML

          cat > analysis_options.yaml <<'YAML'
          include: package:flutter_lints/flutter.yaml

          linter:
            rules:
              prefer_const_constructors: false
              use_build_context_synchronously: false
              depend_on_referenced_packages: false
          YAML

          cat > lib/core.dart <<'DART'
          import 'dart:math';

          const appName = 'CCheker Live';
          const appVersion = '7.1.0';
          const appBuild = '7.1.0+21';
          const appTag = 'v7.1';

          const stripePk = 'pk_test_51UQWXHLSAWNUOV2fKgvafDXscpBBbd067QkfHEDeEkCZvHJht7LyA43wccu1iX4OBPgbGFxtzwmKI6GMS4akzx0O00xWOD8V42';
          const stripeTokenUrl = 'https://api.stripe.com/v1/tokens';
          const stripePiUrl = 'https://api.stripe.com/v1/payment_intents';
          const stripeBalanceUrl = 'https://api.stripe.com/v1/balance';
          const dorkillUrl = 'https://www.dorkill.com/api/check';
          const binlistUrl = 'https://lookup.binlist.net/';
          const defaultProbe = 'https://www.google.com/generate_204';
          const dohUrls = <String>[
            'https://cloudflare-dns.com/dns-query',
            'https://dns.google/resolve',
          ];

          final _onlyDigits = RegExp(r'\D');
          final _allDigits = RegExp(r'^\d+$');
          final _rnd = Random();
          const _idChars = 'abcdefghijklmnopqrstuvwxyz0123456789';

          String digitsOf(String s) => s.replaceAll(_onlyDigits, '');
          bool isDigits(String s) => s.isNotEmpty && _allDigits.hasMatch(s);

          String newId() {
            final b = StringBuffer();
            for (var i = 0; i < 14; i++) {
              b.write(_idChars[_rnd.nextInt(_idChars.length)]);
            }
            return b.toString();
          }

          String pad2(int n) => n.toString().padLeft(2, '0');
          int year4(int y) => y < 100 ? 2000 + y : y;

          String fmtInt(int n) {
            final s = n.abs().toString();
            final b = StringBuffer();
            for (var i = 0; i < s.length; i++) {
              if (i > 0 && (s.length - i) % 3 == 0) b.write('.');
              b.write(s[i]);
            }
            return (n < 0 ? '-' : '') + b.toString();
          }

          bool luhnOk(String pan) {
            var sum = 0;
            var alt = false;
            for (var i = pan.length - 1; i >= 0; i--) {
              var d = pan.codeUnitAt(i) - 48;
              if (d < 0 || d > 9) return false;
              if (alt) {
                d *= 2;
                if (d > 9) d -= 9;
              }
              sum += d;
              alt = !alt;
            }
            return sum % 10 == 0;
          }

          String completeLuhn(String body) {
            for (var d = 0; d <= 9; d++) {
              final c = '$body$d';
              if (luhnOk(c)) return c;
            }
            return body;
          }

          bool expiredCard(int mm, int yy) {
            final now = DateTime.now();
            final y = year4(yy);
            if (y < now.year) return true;
            if (y > now.year) return false;
            return mm < now.month;
          }

          String brandOf(String pan) {
            if (pan.isEmpty) return '';
            if (pan.startsWith('4')) return 'visa';
            if (RegExp(r'^5[1-5]').hasMatch(pan)) return 'mastercard';
            if (RegExp(r'^2[2-7]').hasMatch(pan)) return 'mastercard';
            if (RegExp(r'^3[47]').hasMatch(pan)) return 'amex';
            if (RegExp(r'^6(?:011|5)').hasMatch(pan)) return 'discover';
            if (RegExp(r'^3(?:0[0-5]|[68])').hasMatch(pan)) return 'diners';
            if (pan.startsWith('35')) return 'jcb';
            return 'otra';
          }

          int panLenFor(String brand) => brand == 'amex' ? 15 : 16;
          DART

          cat > lib/models.dart <<'DART'
          import 'core.dart';

          enum CheckStatus {
            unchecked,
            checking,
            live,
            noFunds,
            need3ds,
            cvcFail,
            avsFail,
            restricted,
            unknown,
            dead,
          }

          extension CheckStatusX on CheckStatus {
            String get label => switch (this) {
                  CheckStatus.unchecked => 'sin comprobar',
                  CheckStatus.checking => 'comprobando',
                  CheckStatus.live => 'viva',
                  CheckStatus.noFunds => 'sin fondos',
                  CheckStatus.need3ds => 'pide 3ds',
                  CheckStatus.cvcFail => 'cvv malo',
                  CheckStatus.avsFail => 'zip malo',
                  CheckStatus.restricted => 'restringida',
                  CheckStatus.unknown => 'incierta',
                  CheckStatus.dead => 'muerta',
                };

            String get tag => switch (this) {
                  CheckStatus.live => 'LIVE',
                  CheckStatus.noFunds => 'FUNDS',
                  CheckStatus.need3ds => '3DS',
                  CheckStatus.cvcFail => 'CVC',
                  CheckStatus.avsFail => 'AVS',
                  CheckStatus.restricted => 'REST',
                  CheckStatus.dead => 'DEAD',
                  CheckStatus.checking => '...',
                  CheckStatus.unknown => '?',
                  CheckStatus.unchecked => '-',
                };

            bool get cobrable =>
                this == CheckStatus.live ||
                this == CheckStatus.noFunds ||
                this == CheckStatus.need3ds ||
                this == CheckStatus.cvcFail ||
                this == CheckStatus.avsFail ||
                this == CheckStatus.restricted;

            int get rank => switch (this) {
                  CheckStatus.live => 0,
                  CheckStatus.noFunds => 1,
                  CheckStatus.need3ds => 2,
                  CheckStatus.cvcFail => 3,
                  CheckStatus.avsFail => 4,
                  CheckStatus.restricted => 5,
                  CheckStatus.unknown => 9,
                  CheckStatus.dead => 10,
                  CheckStatus.checking => 11,
                  CheckStatus.unchecked => 12,
                };
          }

          class CreditCard {
            CreditCard({
              required this.id,
              required this.pan,
              required this.expMonth,
              required this.expYear,
              this.cvv = '',
              this.brand = '',
              this.bin = '',
              this.bank = '',
              this.country = '',
              this.level = '',
              this.kind = '',
              this.status = CheckStatus.unchecked,
              this.message = '',
              this.gateway = '',
              this.latencyMs = 0,
              this.checkedAt,
            });

            final String id;
            final String pan;
            final int expMonth;
            final int expYear;
            final String cvv;
            final String brand;
            final String bin;
            final String bank;
            final String country;
            final String level;
            final String kind;
            final CheckStatus status;
            final String message;
            final String gateway;
            final int latencyMs;
            final DateTime? checkedAt;

            String get exp => '${pad2(expMonth)}/${pad2(expYear)}';
            String get key => '$pan|${pad2(expMonth)}|${pad2(expYear)}|$cvv';
            bool get expired => expiredCard(expMonth, expYear);

            CreditCard copyWith({
              CheckStatus? status,
              String? message,
              String? gateway,
              int? latencyMs,
              DateTime? checkedAt,
              String? bank,
              String? country,
              String? level,
              String? kind,
              String? brand,
            }) =>
                CreditCard(
                  id: id,
                  pan: pan,
                  expMonth: expMonth,
                  expYear: expYear,
                  cvv: cvv,
                  brand: brand ?? this.brand,
                  bin: bin,
                  bank: bank ?? this.bank,
                  country: country ?? this.country,
                  level: level ?? this.level,
                  kind: kind ?? this.kind,
                  status: status ?? this.status,
                  message: message ?? this.message,
                  gateway: gateway ?? this.gateway,
                  latencyMs: latencyMs ?? this.latencyMs,
                  checkedAt: checkedAt ?? this.checkedAt,
                );

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'pan': pan,
                  'mm': expMonth,
                  'yy': expYear,
                  'cvv': cvv,
                  'brand': brand,
                  'bank': bank,
                  'country': country,
                  'level': level,
                  'kind': kind,
                  'st': status.name,
                  'msg': message,
                  'gw': gateway,
                  'ms': latencyMs,
                  'at': checkedAt?.toIso8601String(),
                };

            static CreditCard fromJson(Map<String, dynamic> j) {
              final pan = (j['pan'] ?? '').toString();
              return CreditCard(
                id: (j['id'] ?? newId()).toString(),
                pan: pan,
                expMonth: ((j['mm'] ?? 1) as num).toInt(),
                expYear: ((j['yy'] ?? 30) as num).toInt(),
                cvv: (j['cvv'] ?? '').toString(),
                brand: (j['brand'] ?? '').toString(),
                bin: pan.length >= 6 ? pan.substring(0, 6) : '',
                bank: (j['bank'] ?? '').toString(),
                country: (j['country'] ?? '').toString(),
                level: (j['level'] ?? '').toString(),
                kind: (j['kind'] ?? '').toString(),
                status: CheckStatus.values.firstWhere(
                  (s) => s.name == j['st'],
                  orElse: () => CheckStatus.unchecked,
                ),
                message: (j['msg'] ?? '').toString(),
                gateway: (j['gw'] ?? '').toString(),
                latencyMs: ((j['ms'] ?? 0) as num).toInt(),
                checkedAt: j['at'] == null ? null : DateTime.tryParse(j['at'].toString()),
              );
            }
          }

          enum ProxyKind { http, socks }

          enum ProxyHealth { unknown, ok, down }

          class ProxyNode {
            ProxyNode({
              required this.id,
              required this.host,
              required this.port,
              this.user = '',
              this.pass = '',
              this.kind = ProxyKind.http,
              this.health = ProxyHealth.unknown,
              this.latencyMs = 0,
            });

            final String id;
            final String host;
            final int port;
            final String user;
            final String pass;
            final ProxyKind kind;
            final ProxyHealth health;
            final int latencyMs;

            String get label => '$host:$port';

            ProxyNode copyWith({ProxyHealth? health, int? latencyMs}) => ProxyNode(
                  id: id,
                  host: host,
                  port: port,
                  user: user,
                  pass: pass,
                  kind: kind,
                  health: health ?? this.health,
                  latencyMs: latencyMs ?? this.latencyMs,
                );

            Map<String, dynamic> toJson() => {
                  'id': id,
                  'host': host,
                  'port': port,
                  'u': user,
                  'p': pass,
                  'k': kind.name,
                  'h': health.name,
                  'ms': latencyMs,
                };

            static ProxyNode fromJson(Map<String, dynamic> j) => ProxyNode(
                  id: (j['id'] ?? newId()).toString(),
                  host: (j['host'] ?? '').toString(),
                  port: ((j['port'] ?? 8080) as num).toInt(),
                  user: (j['u'] ?? '').toString(),
                  pass: (j['p'] ?? '').toString(),
                  kind: ProxyKind.values.firstWhere(
                    (k) => k.name == j['k'],
                    orElse: () => ProxyKind.http,
                  ),
                  health: ProxyHealth.values.firstWhere(
                    (h) => h.name == j['h'],
                    orElse: () => ProxyHealth.unknown,
                  ),
                  latencyMs: ((j['ms'] ?? 0) as num).toInt(),
                );
          }

          class ImportResult {
            ImportResult({
              required this.cards,
              this.duplicates = 0,
              this.junk = 0,
              this.fixed = 0,
              this.expired = 0,
            });
            final List<CreditCard> cards;
            final int duplicates;
            final int junk;
            final int fixed;
            final int expired;
          }

          class Settings {
            const Settings({
              this.engine = 'stripe',
              this.stripeKey = stripePk,
              this.stripeSk = '',
              this.dorkillKey = '',
              this.retries = 1,
              this.useProxies = false,
              this.doh = true,
              this.concurrency = 6,
              this.timeoutSec = 20,
              this.probeUrl = defaultProbe,
              this.biometrics = false,
              this.autoLockMin = 5,
              this.enrich = true,
              this.binDbUrl = '',
            });

            final String engine;
            final String stripeKey;
            final String stripeSk;
            final String dorkillKey;
            final int retries;
            final bool useProxies;
            final bool doh;
            final int concurrency;
            final int timeoutSec;
            final String probeUrl;
            final bool biometrics;
            final int autoLockMin;
            final bool enrich;
            final String binDbUrl;

            bool get authOn => cleanSk.startsWith('sk_');
            String get cleanSk => stripeSk
                .trim()
                .replaceAll('"', '')
                .replaceAll("'", '')
                .replaceAll(RegExp(r'\s'), '');
            String get mode =>
                authOn ? 'auth real' : (engine == 'both' ? 'cascada' : engine == 'dorkill' ? 'dorkill' : 'token');

            Settings copyWith({
              String? engine,
              String? stripeKey,
              String? stripeSk,
              String? dorkillKey,
              int? retries,
              bool? useProxies,
              bool? doh,
              int? concurrency,
              int? timeoutSec,
              String? probeUrl,
              bool? biometrics,
              int? autoLockMin,
              bool? enrich,
              String? binDbUrl,
            }) =>
                Settings(
                  engine: engine ?? this.engine,
                  stripeKey: stripeKey ?? this.stripeKey,
                  stripeSk: stripeSk ?? this.stripeSk,
                  dorkillKey: dorkillKey ?? this.dorkillKey,
                  retries: retries ?? this.retries,
                  useProxies: useProxies ?? this.useProxies,
                  doh: doh ?? this.doh,
                  concurrency: concurrency ?? this.concurrency,
                  timeoutSec: timeoutSec ?? this.timeoutSec,
                  probeUrl: probeUrl ?? this.probeUrl,
                  biometrics: biometrics ?? this.biometrics,
                  autoLockMin: autoLockMin ?? this.autoLockMin,
                  enrich: enrich ?? this.enrich,
                  binDbUrl: binDbUrl ?? this.binDbUrl,
                );

            Map<String, dynamic> toJson() => {
                  'engine': engine,
                  'pk': stripeKey,
                  'ssk': stripeSk,
                  'dk': dorkillKey,
                  'retries': retries,
                  'px': useProxies,
                  'doh': doh,
                  'conc': concurrency,
                  'to': timeoutSec,
                  'probe': probeUrl,
                  'bio': biometrics,
                  'lock': autoLockMin,
                  'enrich': enrich,
                  'binurl': binDbUrl,
                };

            static Settings fromJson(Map<String, dynamic> j) => Settings(
                  engine: (j['engine'] ?? 'stripe').toString(),
                  stripeKey: (j['pk'] ?? stripePk).toString(),
                  stripeSk: (j['ssk'] ?? '').toString(),
                  dorkillKey: (j['dk'] ?? '').toString(),
                  retries: ((j['retries'] ?? 1) as num).toInt(),
                  useProxies: j['px'] == true,
                  doh: j['doh'] != false,
                  concurrency: ((j['conc'] ?? 6) as num).toInt(),
                  timeoutSec: ((j['to'] ?? 20) as num).toInt(),
                  probeUrl: (j['probe'] ?? defaultProbe).toString(),
                  biometrics: j['bio'] == true,
                  autoLockMin: ((j['lock'] ?? 5) as num).toInt(),
                  enrich: j['enrich'] != false,
                  binDbUrl: (j['binurl'] ?? '').toString(),
                );
          }
          DART

          cat > lib/theme.dart <<'DART'
          import 'package:flutter/material.dart';

          class AppColors {
            static const bg = Color(0xFF0A0B0F);
            static const panel = Color(0xFF12141C);
            static const stroke = Color(0xFF1E2230);
            static const lime = Color(0xFFBAFF54);
            static const cyan = Color(0xFF54E0FF);
            static const violet = Color(0xFF9B7BFF);
            static const amber = Color(0xFFFFC65C);
            static const red = Color(0xFFFF6B6B);
            static const textHi = Color(0xFFEDF0F7);
            static const textMid = Color(0xFF9AA3B5);
          }

          class AppTextStyles {
            static const title = TextStyle(
              color: AppColors.textHi,
              fontSize: 22,
              fontWeight: FontWeight.w800,
              letterSpacing: -0.4,
            );
            static const body = TextStyle(color: AppColors.textHi, fontSize: 14);
            static const caption = TextStyle(color: AppColors.textMid, fontSize: 12);
            static const tiny = TextStyle(color: AppColors.textMid, fontSize: 10, letterSpacing: 0.6);
            static const mono = TextStyle(
              color: AppColors.textHi,
              fontSize: 13,
              fontFamily: 'monospace',
              letterSpacing: 0.4,
            );
          }

          ThemeData buildTheme() {
            final base = ThemeData.dark(useMaterial3: false);
            return base.copyWith(
              scaffoldBackgroundColor: AppColors.bg,
              colorScheme: base.colorScheme.copyWith(
                primary: AppColors.lime,
                secondary: AppColors.cyan,
                surface: AppColors.panel,
              ),
              inputDecorationTheme: const InputDecorationTheme(
                filled: true,
                fillColor: AppColors.panel,
                border: OutlineInputBorder(
                  borderSide: BorderSide(color: AppColors.stroke),
                  borderRadius: BorderRadius.all(Radius.circular(12)),
                ),
                enabledBorder: OutlineInputBorder(
                  borderSide: BorderSide(color: AppColors.stroke),
                  borderRadius: BorderRadius.all(Radius.circular(12)),
                ),
                focusedBorder: OutlineInputBorder(
                  borderSide: BorderSide(color: AppColors.lime),
                  borderRadius: BorderRadius.all(Radius.circular(12)),
                ),
                labelStyle: AppTextStyles.caption,
              ),
              textSelectionTheme: const TextSelectionThemeData(cursorColor: AppColors.lime),
            );
          }
          DART

          cat > lib/widgets.dart <<'DART'
          import 'package:flutter/material.dart';

          import 'theme.dart';

          class GlassPanel extends StatelessWidget {
            const GlassPanel({super.key, required this.child, this.pad = 14});
            final Widget child;
            final double pad;

            @override
            Widget build(BuildContext context) => Container(
                  padding: EdgeInsets.all(pad),
                  decoration: BoxDecoration(
                    color: AppColors.panel,
                    borderRadius: BorderRadius.circular(16),
                    border: Border.all(color: AppColors.stroke),
                  ),
                  child: child,
                );
          }

          class SectionHeader extends StatelessWidget {
            const SectionHeader(this.text, {super.key});
            final String text;

            @override
            Widget build(BuildContext context) => Padding(
                  padding: const EdgeInsets.fromLTRB(2, 18, 2, 8),
                  child: Text(text.toUpperCase(), style: AppTextStyles.tiny),
                );
          }

          class NeonButton extends StatelessWidget {
            const NeonButton({
              super.key,
              required this.label,
              this.icon,
              this.onPressed,
              this.color = AppColors.lime,
              this.expand = false,
            });

            final String label;
            final IconData? icon;
            final VoidCallback? onPressed;
            final Color color;
            final bool expand;

            @override
            Widget build(BuildContext context) {
              final on = onPressed != null;
              final c = on ? color : AppColors.textMid;
              final body = Container(
                padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 12),
                decoration: BoxDecoration(
