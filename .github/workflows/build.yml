          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';

          import '../checker.dart';
          import '../core.dart';
          import '../finder.dart';
          import '../models.dart';
          import '../providers.dart';
          import '../repos.dart';
          import '../scraper.dart';
          import '../theme.dart';
          import '../widgets.dart';

          class ScrapeScreen extends ConsumerStatefulWidget {
            const ScrapeScreen({super.key});
            @override
            ConsumerState<ScrapeScreen> createState() => _ScrapeScreenState();
          }

          class _ScrapeScreenState extends ConsumerState<ScrapeScreen> {
            final _picked = <String>{};
            final _url = TextEditingController();
            final _query = TextEditingController(text: 'cc checker');
            final _token = TextEditingController();
            final _pickedFound = <String>{};
            List<FoundSource> _found = [];
            bool _finding = false;
            bool _scoring = false;
            String _step = '';
            double _limit = 300;
            double _repos = 8;
            double _sample = 10;

            @override
            void initState() {
              super.initState();
              _token.text = (Vault.i.data['gh_token'] ?? '').toString();
            }

            @override
            void dispose() {
              _url.dispose();
              _query.dispose();
              _token.dispose();
              super.dispose();
            }

            void _disposeLater(List<TextEditingController> cs) {
              Future<void>.delayed(const Duration(milliseconds: 350), () {
                for (final c in cs) {
                  c.dispose();
                }
              });
            }

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            void _sortFound() {
              _found.sort((a, b) {
                final ra = a.hitRate;
                final rb = b.hitRate;
                if (ra != null && rb != null && ra != rb) return rb.compareTo(ra);
                if (ra != null && rb == null) return -1;
                if (ra == null && rb != null) return 1;
                return b.cards.compareTo(a.cards);
              });
            }

            Future<void> _runFinder() async {
              final q = _query.text.trim().isEmpty ? 'cc checker' : _query.text.trim();

              setState(() {
                _finding = true;
                _found = [];
                _pickedFound.clear();
                _step = 'iniciando';
              });

              final engine = CheckEngine(ref.read(settingsProvider), proxies: ref.read(proxiesProvider));

              try {
                final res = await SourceFinder(engine, token: _token.text.trim()).search(
                  query: q,
                  maxRepos: _repos.round(),
                  onStep: (s, d, t) {
                    if (!mounted) return;
                    setState(() => _step = t > 1 ? '$s ($d/$t)' : s);
                  },
                );

                if (!mounted) return;
                setState(() {
                  _found = res;
                  _finding = false;
                  _step = res.isEmpty ? 'sin archivos con tarjetas reales' : '${res.length} fuentes verificadas';
                });
              } catch (e) {
                if (!mounted) return;
                setState(() {
                  _finding = false;
                  _step = SourceFinder.isRate(e)
                      ? 'GitHub te limito. Pon un token o espera una hora.'
                      : 'error: ${Scraper.shortError(e)}';
                });
              } finally {
                engine.dispose();
              }
            }

            Future<void> _runScore() async {
              if (_found.isEmpty) return;

              setState(() {
                _scoring = true;
                _step = 'puntuando';
              });

              final engine = CheckEngine(ref.read(settingsProvider), proxies: ref.read(proxiesProvider));

              try {
                await SourceFinder(engine, token: _token.text.trim()).scoreAll(
                  _found,
                  sample: _sample.round(),
                  onStep: (s, d, t) {
                    if (!mounted) return;
                    setState(() => _step = '$s ($d/$t)');
                  },
                );
              } catch (e) {
                if (mounted) setState(() => _step = 'error: ${Scraper.shortError(e)}');
              } finally {
                engine.dispose();
                if (!mounted) return;
                setState(() {
                  _scoring = false;
                  _sortFound();
                  _step = 'puntuacion lista';
                });
              }
            }

            Future<void> _addFound() async {
              final sel = _found.where((f) => _pickedFound.contains(f.url)).toList();
              if (sel.isEmpty) return;

              for (final f in sel) {
                final rate = f.hitRate;
                await ref.read(sourcesProvider.notifier).upsert(
                      ScrapeSource(
                        id: newId(),
                        name: f.name,
                        url: f.url,
                        note: 'descubierta · ${f.origin} · ${fmtInt(f.cards)} tarjetas en la muestra'
                            '${rate == null ? '' : ' · ${fmtPct(rate)} vivas'}',
                      ),
                    );
              }

              setState(() {
                _found = _found.where((f) => !_pickedFound.contains(f.url)).toList();
                _pickedFound.clear();
              });
              _snack('${sel.length} fuentes agregadas');
            }

            Future<void> _addSource() async {
              final name = TextEditingController();
              final url = TextEditingController();
              var kind = SourceKind.cards;

              await showModalBottomSheet<void>(
                context: context,
                isScrollControlled: true,
                backgroundColor: AppColors.bgElevated,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setLocal) => Padding(
                    padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom + 20, left: 20, right: 20, top: 20),
                    child: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Nueva fuente', style: AppTextStyles.h2),
                          const SizedBox(height: 14),
                          Row(
                            children: [
                              for (final k in SourceKind.values)
                                Padding(
                                  padding: const EdgeInsets.only(right: 8),
                                  child: ChoiceChip(
                                    label: Text(k == SourceKind.bins ? 'base BIN' : 'tarjetas'),
                                    selected: kind == k,
                                    onSelected: (_) => setLocal(() => kind = k),
                                  ),
                                ),
                            ],
                          ),
                          const SizedBox(height: 12),
                          TextField(controller: name, style: AppTextStyles.mono, decoration: const InputDecoration(labelText: 'nombre')),
                          TextField(controller: url, style: AppTextStyles.mono, decoration: const InputDecoration(labelText: 'url')),
                          const SizedBox(height: 16),
                          NeonButton(
                            label: 'Agregar',
                            icon: Icons.add,
                            onPressed: () async {
                              if (url.text.trim().isEmpty) return;
                              await ref.read(sourcesProvider.notifier).upsert(
                                    ScrapeSource(
                                      id: newId(),
                                      name: name.text.trim().isEmpty ? 'fuente' : name.text.trim(),
                                      url: url.text.trim(),
                                      kind: kind,
                                    ),
                                  );
                              if (ctx.mounted) Navigator.pop(ctx);
                            },
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );

              _disposeLater([name, url]);
            }

            Widget _preset((String, String) p) {
              final on = _query.text.trim() == p.$2;
              return GestureDetector(
                onTap: _finding ? null : () => setState(() => _query.text = p.$2),
                child: Container(
                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
