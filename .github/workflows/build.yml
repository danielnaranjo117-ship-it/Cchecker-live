                final res = parseCards(bodyToText(body), repairLuhn: true, strictScheme: true);

                final fresh = <CreditCard>[];
                final seen = <String>{};
                var dup = 0;

                for (final c in res.cards) {
                  if (existing.contains(c.pan) || seen.contains(c.pan)) {
                    dup++;
                    continue;
                  }
                  seen.add(c.pan);
                  if (fresh.length < limit) fresh.add(c);
                }

                return ScrapeReport(
                  source: s.name,
                  ms: sw.elapsedMilliseconds,
                  cards: fresh,
                  found: res.cards.length,
                  dup: dup,
                  junk: res.junk,
                );
              } catch (e) {
                return ScrapeReport(source: s.name, ms: sw.elapsedMilliseconds, error: shortError(e));
              }
