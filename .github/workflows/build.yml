name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Preparar proyecto
        run: |
          set -e
          echo "=== CCheker Live v6.4 ==="
          flutter create --org com.cchekerx --project-name ccheker_live --platforms android ccheker_live
          cd ccheker_live
          rm -rf lib test
          mkdir -p lib/screens
          rm -rf android/app/src/main/res/mipmap-anydpi-v26

      - name: Icono propio
        run: |
          cd ccheker_live
          cat > /tmp/make_icon.py <<'PY'
          import math, struct, zlib, os, sys

          def lerp(a, b, t):
              return a + (b - a) * t

          def shield(x, y, k):
              top, bot = -0.82 * k, 0.88 * k
              if y < top or y > bot:
                  return False
              half = 0.66 * k
              if y <= 0.0:
                  rad = 0.20 * k
                  if y < top + rad:
                      dy = (top + rad) - y
                      hw = half - rad + math.sqrt(max(0.0, rad * rad - dy * dy))
                  else:
                      hw = half
              else:
                  t = y / bot
                  hw = half * math.sqrt(max(0.0, 1.0 - t * t))
              return abs(x) <= hw

          def seg(px, py, ax, ay, bx, by):
              vx, vy = bx - ax, by - ay
              wx, wy = px - ax, py - ay
              L = vx * vx + vy * vy
              t = 0.0 if L == 0 else max(0.0, min(1.0, (wx * vx + wy * vy) / L))
              dx, dy = px - (ax + t * vx), py - (ay + t * vy)
              return math.sqrt(dx * dx + dy * dy)

          def sample(x, y):
              r = 0.44
              ax, ay = abs(x), abs(y)
              dx, dy = max(0.0, ax - (1.0 - r)), max(0.0, ay - (1.0 - r))
              if math.sqrt(dx * dx + dy * dy) > r:
                  return (0, 0, 0, 0)
              t = (y + 1.0) * 0.5
              bg = (int(lerp(9, 19, t)), int(lerp(13, 28, t)), int(lerp(24, 48, t)), 255)
              if shield(x, y, 1.0):
                  g = max(0.0, min(1.0, (y + 0.85) / 1.70))
                  col = (int(lerp(182, 255, g)), int(lerp(255, 224, g)), int(lerp(60, 255, g)), 255)
                  if shield(x, y, 0.80):
                      col = bg
                      d = min(seg(x, y, -0.30, 0.00, -0.08, 0.24), seg(x, y, -0.08, 0.24, 0.32, -0.24))
                      if d <= 0.075:
                          col = (182, 255, 60, 255)
                  return col
              return bg

          def png_bytes(size, rows):
              raw = bytearray()
              for row in rows:
                  raw.append(0)
                  for px in row:
                      raw += bytes(px)
              def chunk(tag, data):
                  return struct.pack('>I', len(data)) + tag + data + struct.pack('>I', zlib.crc32(tag + data) & 0xffffffff)
              out = b'\x89PNG\r\n\x1a\n'
              out += chunk(b'IHDR', struct.pack('>IIBBBBB', size, size, 8, 6, 0, 0, 0))
              out += chunk(b'IDAT', zlib.compress(bytes(raw), 9))
              out += chunk(b'IEND', b'')
              return out

          def render(size):
              S = 3
              n = S * S
              rows = []
              for j in range(size):
                  row = []
                  for i in range(size):
                      rr = gg = bb = aa = 0
                      for sy in range(S):
                          for sx in range(S):
                              x = ((i + (sx + 0.5) / S) / size) * 2.0 - 1.0
                              y = ((j + (sy + 0.5) / S) / size) * 2.0 - 1.0
                              c = sample(x, y)
                              a = c[3]
                              rr += c[0] * a
                              gg += c[1] * a
                              bb += c[2] * a
                              aa += a
                      if aa == 0:
                          row.append((0, 0, 0, 0))
                      else:
                          row.append((rr // aa, gg // aa, bb // aa, aa // n))
                  rows.append(row)
              return rows

          root = sys.argv[1]
          for name, px in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              d = os.path.join(root, 'mipmap-' + name)
              os.makedirs(d, exist_ok=True)
              open(os.path.join(d, 'ic_launcher.png'), 'wb').write(png_bytes(px, render(px)))
          print('iconos listos')
          PY
          python3 /tmp/make_icon.py android/app/src/main/res

      - name: Parche Android
        run: |
          cd ccheker_live
          set -e
          MAN=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="ccheker_live"/android:label="CCheker Live"/' "$MAN"
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.USE_BIOMETRIC"/>\n    <uses-permission android:name="android.permission.USE_FINGERPRINT"/>\n    <application|' "$MAN"

          MA=$(find android/app/src/main/kotlin -name "MainActivity.kt" | head -n1)
          PKG=$(echo "$MA" | sed 's|android/app/src/main/kotlin/||; s|/MainActivity.kt||; s|/|.|g')
          cat > "$MA" <<KT
          package $PKG

          import io.flutter.embedding.android.FlutterFragmentActivity

          class MainActivity : FlutterFragmentActivity()
          KT

          GR=android/app/build.gradle
          sed -i -E 's/minSdkVersion flutter\.minSdkVersion/minSdkVersion 23/' "$GR" || true
          sed -i -E 's/minSdk = flutter\.minSdkVersion/minSdk 23/' "$GR" || true
          sed -i -E 's/minSdkVersion 21/minSdkVersion 23/' "$GR" || true
          sed -i -E 's/minSdkVersion 19/minSdkVersion 23/' "$GR" || true
          sed -i -E 's/compileSdkVersion flutter\.compileSdkVersion/compileSdkVersion 35/' "$GR" || true
          sed -i -E 's/compileSdk = flutter\.compileSdkVersion/compileSdk 35/' "$GR" || true
          echo "android parcheado"

      - name: Escribir codigo
        run: |
          cd ccheker_live

          cat > pubspec.yaml <<'YAML'
          name: ccheker_live
          description: Checker masivo de tarjetas con boveda cifrada, cola por isolates y buscador de fuentes.
          publish_to: 'none'
          version: 6.4.0+14

          environment:
            sdk: '>=3.5.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            flutter_riverpod: ^2.5.1
            shared_preferences: ^2.2.3
            http: ^1.2.1
            crypto: ^3.0.3
            encrypt: ^5.0.3
            path_provider: ^2.1.4
            connectivity_plus: ^6.0.3
            share_plus: ^7.2.1
            local_auth: ^2.2.0

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^4.0.0

          flutter:
            uses-material-design: true
          YAML

          cat > analysis_options.yaml <<'YAML'
          include: package:flutter_lints/flutter.yaml

          linter:
            rules:
              prefer_const_constructors: false
              use_build_context_synchronously: false
              depend_on_referenced_packages: false
          YAML

          cat > lib/core.dart <<'DART'
          import 'dart:math';

          const appName = 'CCheker Live';
          const appVersion = '6.4.0';
          const appBuild = '6.4.0+14';
          const appTag = 'v6.4';

          const stripePk = 'pk_test_51UQWXHLSAWNUOV2fKgvafDXscpBBbd067QkfHEDeEkCZvHJht7LyA43wccu1iX4OBPgbGFxtzwmKI6GMS4akzx0O00xWOD8V42';
          const stripeTokenUrl = 'https://api.stripe.com/v1/tokens';
          const stripePmUrl = 'https://api.stripe.com/v1/payment_methods';
          const stripePiUrl = 'https://api.stripe.com/v1/payment_intents';
          const dorkillUrl = 'https://www.dorkill.com/api/check';
          const binlistUrl = 'https://lookup.binlist.net/';
          const defaultProbe = 'https://www.google.com/generate_204';

          final _onlyDigits = RegExp(r'\D');
          final _allDigits = RegExp(r'^\d+$');
          final _alpha = RegExp(r'[A-Za-z]');

          String digitsOf(String s) => s.replaceAll(_onlyDigits, '');
          bool isDigits(String s) => s.isNotEmpty && _allDigits.hasMatch(s);
          bool hasAlpha(String s) => _alpha.hasMatch(s);

          String newId() {
            const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
            final r = Random.secure();
            return List.generate(12, (_) => chars[r.nextInt(chars.length)]).join();
          }

          String maskPan(String pan) {
            if (pan.length <= 10) return pan;
            return '${pan.substring(0, 6)}******${pan.substring(pan.length - 4)}';
          }

          String fmtInt(int n) {
            final s = n.abs().toString();
            final b = StringBuffer();
            for (var i = 0; i < s.length; i++) {
              if (i > 0 && (s.length - i) % 3 == 0) b.write('.');
              b.write(s[i]);
            }
            return '${n < 0 ? '-' : ''}$b';
          }

          String fmtPct(double v) => '${(v * 100).toStringAsFixed(1)}%';

          String fmtSecs(int s) {
            if (s < 60) return '${s}s';
            final m = s ~/ 60;
            final r = s % 60;
            return '${m}m ${r}s';
          }

          String year4(int yy) => yy >= 100 ? '$yy' : '${2000 + yy}';

          int luhnSum(String pan) {
            var sum = 0;
            var alt = false;
            for (var i = pan.length - 1; i >= 0; i--) {
              var d = pan.codeUnitAt(i) - 48;
              if (d < 0 || d > 9) return -1;
              if (alt) {
                d *= 2;
                if (d > 9) d -= 9;
              }
              sum += d;
              alt = !alt;
            }
            return sum;
          }

          bool luhn(String pan) {
            if (pan.length < 12 || pan.length > 19) return false;
            final s = luhnSum(pan);
            return s > 0 && s % 10 == 0;
          }

          String fixLuhn(String pan) {
            if (pan.length < 2) return pan;
            final body = pan.substring(0, pan.length - 1);
            for (var d = 0; d <= 9; d++) {
              final cand = '$body$d';
              if (luhn(cand)) return cand;
            }
            return pan;
          }

          String completeLuhn(String partial) {
            var sum = 0;
            var alt = true;
            for (var i = partial.length - 1; i >= 0; i--) {
              var d = partial.codeUnitAt(i) - 48;
              if (d < 0 || d > 9) return partial;
              if (alt) {
                d *= 2;
                if (d > 9) d -= 9;
              }
              sum += d;
              alt = !alt;
            }
            return '$partial${(10 - (sum % 10)) % 10}';
          }

          String schemeOf(String pan) {
            if (pan.isEmpty) return '';
            if (pan.startsWith('4')) return 'visa';
            final two = pan.length >= 2 ? int.tryParse(pan.substring(0, 2)) ?? 0 : 0;
            final three = pan.length >= 3 ? int.tryParse(pan.substring(0, 3)) ?? 0 : 0;
            final four = pan.length >= 4 ? int.tryParse(pan.substring(0, 4)) ?? 0 : 0;
            if (two >= 51 && two <= 55) return 'mastercard';
            if (four >= 2221 && four <= 2720) return 'mastercard';
            if (three >= 300 && three <= 305) return 'diners';
            if (two == 36 || two == 38 || two == 39) return 'diners';
            if (four == 6011 || three == 65 || (three >= 644 && three <= 649)) return 'discover';
            if (four >= 3528 && four <= 3589) return 'jcb';
            if (two == 34 || two == 37) return 'amex';
            if (two == 62) return 'unionpay';
            return 'otra';
          }

          const schemeNames = {
            'visa': 'Visa',
            'mastercard': 'Mastercard',
            'amex': 'Amex',
            'discover': 'Discover',
            'jcb': 'JCB',
            'diners': 'Diners',
            'unionpay': 'UnionPay',
            'otra': 'Otra',
          };

          const countryNames = {
            'US': 'Estados Unidos',
            'VE': 'Venezuela',
            'CO': 'Colombia',
            'BR': 'Brasil',
            'MX': 'Mexico',
            'AR': 'Argentina',
            'CL': 'Chile',
            'PE': 'Peru',
            'ES': 'Espana',
            'GB': 'Reino Unido',
            'CA': 'Canada',
            'DE': 'Alemania',
            'FR': 'Francia',
            'IT': 'Italia',
            'JP': 'Japon',
            'CN': 'China',
            'IN': 'India',
            'RU': 'Rusia',
            'TR': 'Turquia',
            'PA': 'Panama',
          };

          String flagEmoji(String cc) {
            if (cc.length != 2) return '';
            const base = 0x1F1E6;
            final a = cc.toUpperCase().codeUnitAt(0) - 65;
            final b = cc.toUpperCase().codeUnitAt(1) - 65;
            if (a < 0 || a > 25 || b < 0 || b > 25) return '';
            return String.fromCharCodes([base + a, base + b]);
          }

          bool isExpired(int mm, int yy) {
            final now = DateTime.now();
            final curY = now.year % 100;
            if (yy > curY) return false;
            if (yy < curY) return true;
            return mm < now.month;
          }
          DART

          cat > lib/value.dart <<'DART'
          import 'models.dart';

          /// Estimacion del saldo disponible. NO es el saldo real: es un rango
          /// inferido del tipo, nivel y pais del BIN. Sirve para decidir si vale
          /// la pena vaciar la tarjeta antes de gastar un request en ella.
          class BalanceRange {
            const BalanceRange(this.min, this.max, this.confidence, this.note);

            final int min;
            final int max;
            final int confidence;
            final String note;

            bool get known => max > 0;
            String get label => known ? '\$${_k(min)} - \$${_k(max)}' : 'sin estimar';
            String get short => known ? '\$${_k(min)}-${_k(max)}' : '?';
            String get confLabel => switch (confidence) {
                  3 => 'alta',
                  2 => 'media',
                  1 => 'baja',
                  _ => 'sin datos',
                };

            String get plan => known ? 'valida con \$1, luego intenta \$${_k(max)}' : 'valida con \$1 y sube segun respuesta';

            static String _k(int n) {
              if (n >= 1000000) return '${(n / 1000000).toStringAsFixed(1)}M';
              if (n >= 1000) {
                final k = n / 1000;
                return k == k.roundToDouble() ? '${k.round()}k' : '${k.toStringAsFixed(1)}k';
              }
              return '$n';
            }
          }

          const _tipoBase = <String, (int, int)>{
            'prepaid': (5, 120),
            'debit': (80, 1200),
            'credit': (300, 3000),
            'charge': (1500, 20000),
          };

          const _nivelMult = <String, double>{
            'classic': 1.0,
            'standard': 1.0,
            'titanium': 2.0,
            'gold': 2.5,
            'platinum': 3.5,
            'signature': 5.0,
            'world': 4.5,
            'world elite': 6.0,
            'infinite': 10.0,
            'business': 8.0,
            'corporate': 8.0,
            'commercial': 8.0,
          };

          const _paisMult = <String, double>{
            'US': 1.0,
            'CA': 0.95,
            'GB': 0.9,
            'AU': 0.9,
            'NZ': 0.85,
            'DE': 0.85,
            'NL': 0.85,
            'SE': 0.85,
            'CH': 0.95,
            'FR': 0.8,
            'AE': 0.8,
            'SA': 0.8,
            'IT': 0.75,
            'ES': 0.75,
            'MX': 0.6,
            'CL': 0.6,
            'BR': 0.55,
            'CO': 0.5,
            'PE': 0.5,
            'AR': 0.45,
            'VE': 0.4,
            'IN': 0.4,
            'TR': 0.4,
            'ID': 0.4,
            'PH': 0.4,
          };

          const paisesDuros = <String>{'BR', 'IN', 'TR', 'MX', 'CO', 'AR', 'ID', 'PH', 'VN', 'NG'};

          BalanceRange estimateBalance(CreditCard c) {
            final tipo = c.cardType.toLowerCase().trim();
            final nivel = c.level.toLowerCase().trim();
            final pais = c.country.toUpperCase().trim();

            final base = _tipoBase[tipo];
            if (base == null && nivel.isEmpty) {
              return const BalanceRange(0, 0, 0, 'Falta enriquecer el BIN: sin tipo ni nivel no hay rango.');
            }

            var lo = base?.$1 ?? 150;
            var hi = base?.$2 ?? 2000;
            var conf = 1;
            if (base != null) conf++;
            if (pais.isNotEmpty) conf++;

            if (tipo == 'prepaid') {
              hi = hi < 120 ? hi : 120;
            } else {
              var mult = 1.0;
              for (final e in _nivelMult.entries) {
                if (nivel.contains(e.key) && e.value > mult) mult = e.value;
              }
              if (mult > 1) {
                lo = (lo * mult).round();
                hi = (hi * mult).round();
                conf++;
              }
            }

            if (c.brand == 'amex' && tipo != 'prepaid') {
              if (lo < 1500) lo = 1500;
              if (hi < 20000) hi = 20000;
            }

            final pm = _paisMult[pais] ?? 0.7;
            lo = (lo * pm).round();
            hi = (hi * pm).round();

            if (lo < 5) lo = 5;
            if (hi < lo) hi = lo;

            final nota = StringBuffer('Base: ${tipo.isEmpty ? 'desconocido' : tipo}');
            if (nivel.isNotEmpty) nota.write(' · nivel $nivel');
            nota.write(pais.isEmpty ? ' · pais desconocido' : ' · $pais');
            if (paisesDuros.contains(pais)) nota.write(' · 3DS fuerte');

            return BalanceRange(lo, hi, conf > 3 ? 3 : conf, nota.toString());
          }
          DART

