            Future<void> _probe() async {
              final s = ref.read(settingsProvider);
              final key = s.stripeKey.isEmpty ? stripePk : s.stripeKey;

              setState(() => _probing = true);

              final a = await CheckEngine.probeRaw(key: key, doh: false, timeoutSec: s.timeoutSec);
              final b = await CheckEngine.probeRaw(key: key, doh: true, timeoutSec: s.timeoutSec);
              final c = await CheckEngine.probeRaw(key: key, doh: false, timeoutSec: s.timeoutSec, alt: true);
              final d = await CheckEngine.probeRaw(key: key, doh: true, timeoutSec: s.timeoutSec, alt: true);

              if (!mounted) return;
              setState(() => _probing = false);

              final txt = 'key: ${CheckEngine.maskKey(key)}\n\n$a\n\n$b\n\n$c\n\n$d\n\n'
                  'Lectura: 200 = key buena y surface activa. 401 = key muerta. 429 = limite. '
                  '400 con "unsupported" = falta activar tokenization en el panel de Stripe. '
                  'FALLO = no llega a Stripe.';

              await showDialog<void>(
                context: context,
                builder: (ctx) => AlertDialog(
                  backgroundColor: AppColors.bgElevated,
                  title: const Text('Prueba cruda de Stripe', style: AppTextStyles.h2),
                  content: SingleChildScrollView(child: SelectableText(txt, style: AppTextStyles.tiny)),
