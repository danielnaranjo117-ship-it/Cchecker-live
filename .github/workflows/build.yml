            }

            Future<void> remove(String id) async {
              state = state.where((p) => p.id != id).toList();
              await persist();
            }

            Future<void> removeMany(Set<String> ids) async {
              if (ids.isEmpty) return;
              state = state.where((p) => !ids.contains(p.id)).toList();
              await persist();
            }

            Future<void> setHealth(String id, ProxyHealth h, int ms) async {
              state = state.map((p) {
                if (p.id != id) return p;
                p.health = h;
                p.latencyMs = ms;
                return p;
              }).toList();
              await persist();
            }

            Future<void> setHealthMany(Map<String, (ProxyHealth, int)> m) async {
              if (m.isEmpty) return;
              state = state.map((p) {
                final v = m[p.id];
                if (v == null) return p;
                p.health = v.$1;
                p.latencyMs = v.$2;
                return p;
              }).toList();
              await persist();
            }
          }

          final netProvider = StateNotifierProvider<NetNotifier, NetSense>((ref) {
            final n = NetNotifier();
            n.start();
            ref.onDispose(n.stop);
            return n;
          });

          class NetNotifier extends StateNotifier<NetSense> {
            NetNotifier() : super(NetSense.i);
            StreamSubscription<void>? _s;

            @override
            bool updateShouldNotify(NetSense old, NetSense current) => true;

            void start() {
              NetSense.i.start();
              _s = NetSense.i.changes.listen((_) {
                if (mounted) state = NetSense.i;
              });
              unawaited(NetSense.i.ping());
            }

            void stop() {
              _s?.cancel();
              _s = null;
              NetSense.i.stop();
            }
          }

          final lockProvider = StateProvider<bool>((ref) => true);
          final setupProvider = StateProvider<bool>((ref) => Vault.i.setupDone);
          final tabProvider = StateProvider<int>((ref) => 0);
          final binStatusProvider = StateProvider<BinStatus>((ref) => const BinStatus());

          void refreshVaultScoped(WidgetRef ref) {
            ref.invalidate(settingsProvider);
            ref.invalidate(cardsProvider);
            ref.invalidate(proxiesProvider);
            ref.invalidate(sourcesProvider);
          }

          final sourcesProvider = StateNotifierProvider<SourcesNotifier, List<ScrapeSource>>((ref) => SourcesNotifier());

          class SourcesNotifier extends StateNotifier<List<ScrapeSource>> {
            SourcesNotifier() : super(defaultSources) {
              final raw = Vault.i.data['sources'];
              if (raw is List && raw.isNotEmpty) {
                state = raw.map((e) => ScrapeSource.fromJson((e as Map).cast<String, dynamic>())).toList();
              }
            }

            Future<void> persist() async {
              Vault.i.data['sources'] = state.map((s) => s.toJson()).toList();
              await Vault.i.save();
            }

            Future<void> upsert(ScrapeSource s) async {
              state = [...state.where((x) => x.id != s.id), s];
              await persist();
            }

            Future<void> remove(String id) async {
              state = state.where((x) => x.id != id).toList();
              await persist();
            }

            Future<void> reset() async {
              state = defaultSources;
              await persist();
            }
          }

          class ScrapeState {
            const ScrapeState({
              this.running = false,
              this.done = 0,
              this.total = 0,
              this.current = '',
              this.reports = const <ScrapeReport>[],
              this.staged = const <CreditCard>[],
              this.onlineBin = false,
            });

            final bool running;
            final int done;
            final int total;
            final String current;
            final List<ScrapeReport> reports;
            final List<CreditCard> staged;
            final bool onlineBin;

            double get pct => total == 0 ? 0 : done / total;

            ScrapeState copyWith({
              bool? running,
              int? done,
              int? total,
              String? current,
              List<ScrapeReport>? reports,
              List<CreditCard>? staged,
              bool? onlineBin,
            }) =>
                ScrapeState(
                  running: running ?? this.running,
                  done: done ?? this.done,
                  total: total ?? this.total,
                  current: current ?? this.current,
                  reports: reports ?? this.reports,
                  staged: staged ?? this.staged,
                  onlineBin: onlineBin ?? this.onlineBin,
                );
          }

          final scrapeProvider = StateNotifierProvider<ScrapeNotifier, ScrapeState>((ref) => ScrapeNotifier(ref));

          class ScrapeNotifier extends StateNotifier<ScrapeState> {
            ScrapeNotifier(this.ref) : super(const ScrapeState());

            final Ref ref;
            bool _cancel = false;

            void setOnlineBin(bool v) => state = state.copyWith(onlineBin: v);

            void cancel() => _cancel = true;

            void clear() => state = ScrapeState(onlineBin: state.onlineBin);

            Future<void> pullUrl(String url, {int limit = 300}) async {
              final host = Uri.tryParse(url)?.host ?? url;
              await pull(<ScrapeSource>[ScrapeSource(id: 'url', name: host, url: url)], limit: limit);
            }

            Future<void> pull(List<ScrapeSource> list, {int limit = 300}) async {
              if (state.running || list.isEmpty) return;
              _cancel = false;

              final startReports = state.reports;
              final startStaged = state.staged;
              final onlineBin = state.onlineBin;

              state = ScrapeState(
                running: true,
                total: list.length,
                reports: startReports,
                staged: startStaged,
                onlineBin: onlineBin,
              );

              final engine = CheckEngine(ref.read(settingsProvider), proxies: ref.read(proxiesProvider));
              final seen = ref.read(cardsProvider).map((c) => c.pan).toSet();
              for (final c in startStaged) {
                seen.add(c.pan);
              }

              final reports = <ScrapeReport>[...startReports];
              final staged = <CreditCard>[...startStaged];
              var done = 0;

              try {
                for (final s in list) {
                  if (_cancel) break;
                  state = state.copyWith(current: s.name, done: done);

                  final r = await Scraper(engine, limit: limit).pull(s, existing: seen);
                  for (final c in r.cards) {
                    seen.add(c.pan);
                  }
                  staged.addAll(r.cards);
                  reports.add(r);
                  done++;

                  state = state.copyWith(
                    done: done,
                    current: s.name,
                    reports: List<ScrapeReport>.of(reports),
                    staged: List<CreditCard>.of(staged),
                  );
                }
              } finally {
                engine.dispose();
              }

              state = state.copyWith(running: false, current: '');
            }

            Future<void> commit({bool andRun = false}) async {
              final cards = state.staged;
              if (cards.isEmpty) return;

              await BinDb.i.loadIndex();

              var out = cards
                  .map((c) {
                    final i = BinDb.i.lookup(c.pan);
                    return i == null ? c : c.copyWith(bank: i.bank, country: i.country, cardType: i.cardType, level: i.level);
                  })
                  .toList();

              if (state.onlineBin) out = await _onlineEnrich(out);

              await ref.read(cardsProvider.notifier).addAll(out);
              final ids = out.map((c) => c.id).toList();
              state = ScrapeState(onlineBin: state.onlineBin);

              if (andRun) {
                ref.read(tabProvider.notifier).state = 0;
                await ref.read(runProvider.notifier).run(ids: ids);
              }
            }

            Future<List<CreditCard>> _onlineEnrich(List<CreditCard> cards) async {
              final need = cards.where((c) => c.bank.isEmpty).take(150).toList();
              if (need.isEmpty) return cards;

              final engine = CheckEngine(ref.read(settingsProvider), proxies: ref.read(proxiesProvider));
              final resolver = OnlineBin(engine);
              final cache = <String, BinInfo?>{};
              var cursor = 0;

              Future<void> worker() async {
                while (true) {
                  final i = cursor;
                  if (i >= need.length) return;
                  cursor++;

                  final key = need[i].pan.length >= 6 ? need[i].pan.substring(0, 6) : need[i].pan;
                  if (!cache.containsKey(key)) {
                    cache[key] = await resolver.lookup(key);
                    await Future.delayed(const Duration(milliseconds: 240));
                  }
                }
              }

              await Future.wait(List.generate(2, (_) => worker()));
              engine.dispose();

              return cards.map((c) {
                if (c.bank.isNotEmpty) return c;
                final key = c.pan.length >= 6 ? c.pan.substring(0, 6) : c.pan;
                final info = cache[key];
                if (info == null) return c;
                return c.copyWith(bank: info.bank, country: info.country, cardType: info.cardType, level: info.level);
              }).toList();
            }
          }

          class RunStats {
            const RunStats({
              this.total = 0,
              this.done = 0,
              this.live = 0,
              this.dead = 0,
              this.errors = 0,
              this.paused = false,
              this.startedAt,
            });

            final int total;
            final int done;
            final int live;
            final int dead;
            final int errors;
            final bool paused;
            final DateTime? startedAt;

            double get pct => total == 0 ? 0 : done / total;
            double get hitRate => done == 0 ? 0 : live / done;
          }

          final statsProvider = StateNotifierProvider<StatsNotifier, RunStats>((ref) => StatsNotifier());

          class StatsNotifier extends StateNotifier<RunStats> {
            StatsNotifier() : super(const RunStats());

            void reset(int total) => state = RunStats(total: total, startedAt: DateTime.now());

            void clear() => state = const RunStats();

            void progress({
              required int done,
              required int total,
              required int live,
              required int dead,
              required int errors,
            }) =>
                state = RunStats(
                  total: total,
                  done: done,
                  live: live,
                  dead: dead,
                  errors: errors,
                  paused: state.paused,
                  startedAt: state.startedAt,
                );

            void setPaused(bool v) => state = RunStats(
                  total: state.total,
                  done: state.done,
                  live: state.live,
                  dead: state.dead,
                  errors: state.errors,
                  paused: v,
                  startedAt: state.startedAt,
                );
          }

          final runProvider = StateNotifierProvider<RunController, bool>((ref) => RunController(ref));

          class RunController extends StateNotifier<bool> {
            RunController(this.ref) : super(false);

            final Ref ref;
            MassRunner? _runner;
            StreamSubscription<void>? _netSub;
            bool _autoPaused = false;

            Future<void> run({List<String>? ids, bool onlyPending = false}) async {
              if (state) return;
              state = true;

              final settings = ref.read(settingsProvider);
              var proxies = ref.read(proxiesProvider);
              final all = ref.read(cardsProvider);

              var targets = ids == null ? List<CreditCard>.from(all) : all.where((c) => ids.contains(c.id)).toList();
              if (onlyPending) {
                targets = targets
                    .where((c) =>
                        c.status == CheckStatus.unchecked ||
                        c.status == CheckStatus.unknown ||
                        c.status == CheckStatus.checking)
                    .toList();
              }

              if (targets.isEmpty) {
                state = false;
                return;
              }

              if (settings.proxySticky && settings.useProxies) {
                final pool = proxies.where((p) => p.health != ProxyHealth.down).toList();
                if (pool.isNotEmpty) proxies = <ProxyNode>[pool[Random().nextInt(pool.length)]];
              }

              await BinDb.i.loadIndex();

              final stats = ref.read(statsProvider.notifier);
              final cards = ref.read(cardsProvider.notifier);

              stats.reset(targets.length);
              cards.markChecking(targets.map((c) => c.id).toList());

              final buffer = <String, CheckResult>{};
              final flush = Timer.periodic(const Duration(milliseconds: 160), (_) {
                if (buffer.isEmpty) return;
                cards.applyBatch(Map<String, CheckResult>.of(buffer));
                buffer.clear();
              });

              final conc = (settings.autoTune ? NetSense.i.concurrency : settings.concurrency).clamp(1, 16).toInt();

              final runner = MassRunner(
                cards: targets,
                settings: settings,
                proxies: proxies,
                onResult: (id, r) => buffer[id] = r,
                onProgress: (done, total, live, dead, errors) =>
                    stats.progress(done: done, total: total, live: live, dead: dead, errors: errors),
              );
              _runner = runner;

              _netSub = NetSense.i.changes.listen((_) {
                final r = _runner;
                if (r == null) return;

                if (!NetSense.i.online && !r.paused) {
                  _autoPaused = true;
                  r.pause();
                  stats.setPaused(true);
                } else if (NetSense.i.online && _autoPaused) {
                  _autoPaused = false;
                  r.resume();
                  stats.setPaused(false);
                }

                if (settings.autoTune && NetSense.i.online) {
                  r.setConcurrency(NetSense.i.concurrency);
                }
              });

              try {
                await runner.start(concurrency: conc);
              } finally {
                flush.cancel();

                if (buffer.isNotEmpty) {
                  cards.applyBatch(Map<String, CheckResult>.of(buffer));
                  buffer.clear();
                }

                await _netSub?.cancel();
                _netSub = null;
                _runner = null;
                stats.setPaused(false);
                await cards.persist();
                state = false;
              }
            }

            void pause() {
              _runner?.pause();
              ref.read(statsProvider.notifier).setPaused(true);
            }

            void resume() {
              _autoPaused = false;
              _runner?.resume();
              ref.read(statsProvider.notifier).setPaused(false);
            }

            void stop() => _runner?.stop();

            Future<void> setConcurrency(int n) async {
              await _runner?.setConcurrency(n);
            }
          }
