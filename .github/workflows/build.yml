          Future<ConnectionTask<Socket>> dohFactory(Uri uri, String? proxyHost, int? proxyPort, int timeoutSec) async {
            final t = Duration(seconds: timeoutSec);

            var target = uri.host;
            if (InternetAddress.tryParse(target) == null) {
              try {
                final ips = await NetSense.i.resolve(target);
                if (ips.isNotEmpty) target = ips.first;
              } catch (_) {}
            }

            Socket raw;
            try {
              raw = await Socket.connect(target, uri.port, timeout: t);
            } catch (_) {
              if (target == uri.host) rethrow;
              raw = await Socket.connect(uri.host, uri.port, timeout: t);
            }

            final Socket sock = uri.isScheme('https') ? await SecureSocket.secure(raw, host: uri.host) : raw;

            return ConnectionTask.fromSocket<Socket>(Future<Socket>.value(sock), sock.destroy);
          }

