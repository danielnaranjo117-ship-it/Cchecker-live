            Future<ScrapeReport> pull(ScrapeSource s, {required Set<String> existing}) async {
              final sw = Stopwatch()..start();

              try {
                if (s.kind == SourceKind.bins) {
                  final n = await BinDb.i.installFrom(s.url);
                  return ScrapeReport(source: s.name, ms: sw.elapsedMilliseconds, bins: n);
                }

