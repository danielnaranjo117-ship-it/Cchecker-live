          DART

      - name: Compilar
        run: |
          cd ccheker_live
          flutter pub get

          for g in $(find ~/.pub-cache/hosted/pub.dev -maxdepth 3 -name build.gradle -path "*/android/*"); do
            grep -q "namespace" "$g" && continue
            man="$(dirname "$g")/src/main/AndroidManifest.xml"
            [ -f "$man" ] || continue
            ns=$(grep -o 'package="[^"]*"' "$man" | head -1 | sed 's/package="//; s/"//')
            [ -n "$ns" ] && sed -i "0,/^android {/s||android {\n    namespace '$ns'|" "$g"
          done

          flutter analyze --no-fatal-infos || true
          flutter build apk --release
          ls -lh build/app/outputs/flutter-apk/

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: ccheker-live-v6-4
          path: ccheker_live/build/app/outputs/flutter-apk/app-release.apk
