          class LockScreen extends ConsumerStatefulWidget {
            const LockScreen({super.key});
            @override
            ConsumerState<LockScreen> createState() => _LockScreenState();
          }

          class _LockScreenState extends ConsumerState<LockScreen> {
            final _ctrl = TextEditingController();
            String _err = '';

            @override
            void initState() {
              super.initState();
              WidgetsBinding.instance.addPostFrameCallback((_) => _boot());
            }

            Future<void> _boot() async {
              if (!Vault.i.hasPassword) {
                await Vault.i.unlock('');
                if (!mounted) return;
                refreshVaultScoped(ref);
                ref.read(lockProvider.notifier).state = false;
                return;
              }
              await _tryBio();
            }

            @override
            void dispose() {
              _ctrl.dispose();
              super.dispose();
            }

            void _enter() {
              refreshVaultScoped(ref);
              ref.read(lockProvider.notifier).state = false;
            }

            Future<void> _tryBio() async {
              if (!Vault.i.bioEnabled) return;

              final pass = Vault.i.storedPass;
              if (pass == null) return;

              try {
                final ok = await LocalAuthentication().authenticate(
                  localizedReason: 'Desbloquea $appName',
                  options: const AuthenticationOptions(stickyAuth: true),
                );
                if (!ok) return;
                if (await Vault.i.unlock(pass) && mounted) _enter();
              } catch (_) {}
            }

            Future<void> _submit() async {
              final ok = await Vault.i.unlock(_ctrl.text);
              if (!ok) {
                setState(() => _err = 'PIN incorrecto');
                return;
              }
              _enter();
            }

            @override
            Widget build(BuildContext context) => Scaffold(
                  body: Center(
                    child: SingleChildScrollView(
                      padding: const EdgeInsets.all(28),
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        children: [
                          const LogoMark(size: 76),
                          const SizedBox(height: 20),
                          const Text(appName, style: AppTextStyles.h1),
                          const SizedBox(height: 6),
                          Text('boveda cifrada · $appTag', style: AppTextStyles.caption),
                          const SizedBox(height: 30),
                          TextField(
                            controller: _ctrl,
                            obscureText: true,
                            autofocus: true,
                            keyboardType: TextInputType.number,
                            textInputAction: TextInputAction.go,
                            onSubmitted: (_) => _submit(),
                            style: AppTextStyles.mono,
                            decoration: const InputDecoration(labelText: 'PIN', labelStyle: AppTextStyles.caption),
                          ),
                          if (_err.isNotEmpty) ...[
                            const SizedBox(height: 8),
                            Text(_err, style: const TextStyle(color: AppColors.red, fontSize: 12)),
                          ],
                          const SizedBox(height: 18),
                          NeonButton(label: 'Desbloquear', icon: Icons.lock_open, expand: true, onPressed: _submit),
                          const SizedBox(height: 10),
                          TextButton(
                            onPressed: _tryBio,
                            child: const Text('Usar huella', style: AppTextStyles.caption),
                          ),
                        ],
                      ),
                    ),
                  ),
                );
          }
