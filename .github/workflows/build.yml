                                  ),
                                  const SizedBox(width: 8),
                                  Expanded(child: Text(r.name, style: AppTextStyles.caption)),
                                  Text(r.detail, style: AppTextStyles.tiny),
                                ],
                              ),
                            ),
                          ),
                        ],
                      ],
                    ),
                  ),
                  const SectionHeader('Motor de validacion'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Wrap(
                          spacing: 8,
                          runSpacing: 8,
                          children: [
                            _chip('Stripe', 'stripe', s.engine, n.setEngine),
                            _chip('Dorkill', 'dorkill', s.engine, n.setEngine),
                            _chip('Cascada', 'both', s.engine, n.setEngine),
                          ],
                        ),
                        const SizedBox(height: 8),
                        Text(
                          s.engine == 'stripe'
                              ? 'Stripe: autorizacion real contra el emisor. Se limita con 429 si abusas de la misma key.'
                              : s.engine == 'dorkill'
