          import 'dart:math';

          import 'core.dart';
          import 'models.dart';

          class GenSpec {
            const GenSpec({
              required this.bin,
              this.count = 10,
              this.length = 16,
              this.month = 0,
              this.year = 0,
              this.cvv = '',
            });
            final String bin;
            final int count;
            final int length;
            final int month;
            final int year;
            final String cvv;
          }

          List<CreditCard> generateCards(GenSpec spec) {
            final bin = digitsOf(spec.bin);
            if (bin.length < 4) return const <CreditCard>[];

            final r = Random();
            final scheme = schemeOf(bin);
            final amex = scheme == 'amex';

            var len = spec.length;
            if (len <= bin.length) len = amex ? 15 : 16;
            if (amex && len == 16) len = 15;
            len = len.clamp(bin.length + 1, 19).toInt();

            final now = DateTime.now();
            final out = <CreditCard>[];
            final seen = <String>{};
            var guard = 0;

            while (out.length < spec.count && guard < spec.count * 60 + 500) {
              guard++;
              final b = StringBuffer(bin);
              while (b.length < len - 1) {
                b.write(r.nextInt(10));
              }
              final pan = completeLuhn(b.toString());
              if (!seen.add(pan)) continue;

              final mm = spec.month >= 1 && spec.month <= 12 ? spec.month : 1 + r.nextInt(12);
              final yy = spec.year >= 1 ? spec.year : (now.year % 100) + 2 + r.nextInt(6);
              final cvv = spec.cvv.isNotEmpty
                  ? spec.cvv
                  : amex
                      ? (1000 + r.nextInt(9000)).toString()
                      : (100 + r.nextInt(900)).toString();

              out.add(
                CreditCard(
                  id: newId(),
                  pan: pan,
                  expMonth: mm,
                  expYear: yy,
                  cvv: cvv,
                  brand: scheme,
                  bin: pan.length >= 6 ? pan.substring(0, 6) : pan,
                ),
              );
            }
            return out;
          }
