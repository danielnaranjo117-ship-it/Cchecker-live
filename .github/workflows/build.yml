          final _tagRe = RegExp(r'<[^>]+>');
          final _scriptRe = RegExp(r'<script[^>]*>[\s\S]*?</script>', caseSensitive: false);
          final _styleRe = RegExp(r'<style[^>]*>[\s\S]*?</style>', caseSensitive: false);
          final _commentRe = RegExp(r'<!--[\s\S]*?-->');
          final _breakRe = RegExp(r'</(tr|div|p|li|h[1-6]|table|section|article|td)>|<br\s*/?>', caseSensitive: false);
          final _spacesRe = RegExp(r'[ \t\u00A0]+');
          final _blankRe = RegExp(r'\n{3,}');
          final _entRe = RegExp(r'&(#x?[0-9a-fA-F]+|[a-zA-Z]+);');

          String htmlToText(String html) {
            var s = html
                .replaceAll(_scriptRe, ' ')
                .replaceAll(_styleRe, ' ')
                .replaceAll(_commentRe, ' ')
                .replaceAll(_breakRe, '\n')
                .replaceAll(_tagRe, ' ');

            s = s.replaceAllMapped(_entRe, (m) {
              final v = m.group(1)!;
              switch (v) {
                case 'nbsp':
                  return ' ';
                case 'amp':
                  return '&';
                case 'lt':
                  return '<';
                case 'gt':
                  return '>';
                case 'quot':
                  return '"';
                case 'apos':
                  return "'";
                case 'shy':
                  return '';
              }
              if (v.startsWith('#x') || v.startsWith('#X')) {
                final n = int.tryParse(v.substring(2), radix: 16);
                return n == null ? ' ' : String.fromCharCode(n);
              }
              if (v.startsWith('#')) {
                final n = int.tryParse(v.substring(1));
                return n == null ? ' ' : String.fromCharCode(n);
              }
              return ' ';
            });

            s = s.replaceAll(_spacesRe, ' ');
            s = s.replaceAll(_blankRe, '\n\n');
            return s;
          }

          class OnlineBin {
            OnlineBin(this.engine);

            final CheckEngine engine;

            Future<BinInfo?> lookup(String bin) async {
              final b = bin.replaceAll(RegExp(r'\D'), '');
              if (b.length < 6) return null;

              try {
                final raw = await engine.fetchText(
                  'https://lookup.binlist.net/${b.substring(0, 6)}',
                  headers: const {'Accept-Version': '3'},
                );
                final j = jsonDecode(raw) as Map<String, dynamic>;

                final info = BinInfo(
                  bank: (((j['bank'] as Map?)?['name']) ?? '').toString(),
                  country: (((j['country'] as Map?)?['alpha2']) ?? '').toString(),
                  cardType: (j['type'] ?? '').toString().toLowerCase(),
                  level: (j['brand'] ?? '').toString().toLowerCase(),
