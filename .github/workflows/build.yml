          import 'package:flutter/material.dart';
          import 'package:flutter_riverpod/flutter_riverpod.dart';

          import '../checker.dart';
          import '../core.dart';
          import '../models.dart';
          import '../providers.dart';
          import '../theme.dart';
          import '../widgets.dart';

          class ProxiesScreen extends ConsumerStatefulWidget {
            const ProxiesScreen({super.key});
            @override
            ConsumerState<ProxiesScreen> createState() => _ProxiesScreenState();
          }

          class _ProxiesScreenState extends ConsumerState<ProxiesScreen> {
            bool _testing = false;
            final _exit = <String, String>{};

            void _disposeLater(List<TextEditingController> cs) {
              Future<void>.delayed(const Duration(milliseconds: 350), () {
                for (final c in cs) {
                  c.dispose();
                }
              });
            }

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            Future<void> _add() async {
              final host = TextEditingController();
              final port = TextEditingController();
              final user = TextEditingController();
              final pass = TextEditingController();
              var kind = ProxyKind.http;

              await showModalBottomSheet<void>(
                context: context,
                isScrollControlled: true,
                backgroundColor: AppColors.bgElevated,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (ctx) => StatefulBuilder(
                  builder: (ctx, setLocal) => Padding(
                    padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom + 20, left: 20, right: 20, top: 20),
                    child: SingleChildScrollView(
                      child: Column(
                        mainAxisSize: MainAxisSize.min,
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          const Text('Nuevo proxy', style: AppTextStyles.h2),
                          const SizedBox(height: 14),
                          Row(
                            children: [
                              for (final k in ProxyKind.values)
                                Padding(
                                  padding: const EdgeInsets.only(right: 8),
                                  child: ChoiceChip(
                                    label: Text(k == ProxyKind.socks5 ? 'SOCKS5' : 'HTTP'),
                                    selected: kind == k,
                                    onSelected: (_) => setLocal(() => kind = k),
                                  ),
                                ),
                            ],
                          ),
                          const SizedBox(height: 12),
                          TextField(controller: host, style: AppTextStyles.mono, decoration: const InputDecoration(labelText: 'host o IP')),
                          TextField(
                            controller: port,
                            keyboardType: TextInputType.number,
                            style: AppTextStyles.mono,
                            decoration: const InputDecoration(labelText: 'puerto'),
                          ),
                          TextField(controller: user, style: AppTextStyles.mono, decoration: const InputDecoration(labelText: 'usuario')),
                          TextField(controller: pass, style: AppTextStyles.mono, decoration: const InputDecoration(labelText: 'contrasena')),
                          const SizedBox(height: 16),
                          NeonButton(
                            label: 'Agregar',
                            icon: Icons.add,
                            onPressed: () async {
                              final p = int.tryParse(port.text.trim()) ?? 0;
                              if (host.text.trim().isEmpty || p == 0) return;
                              await ref.read(proxiesProvider.notifier).upsert(
                                    ProxyNode(
                                      id: newId(),
                                      host: host.text.trim(),
                                      port: p,
                                      user: user.text.trim(),
                                      pass: pass.text,
                                      kind: kind,
                                    ),
                                  );
                              if (ctx.mounted) Navigator.pop(ctx);
                            },
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );

              _disposeLater([host, port, user, pass]);
            }

            Future<void> _paste() async {
              final ctrl = TextEditingController();

              await showModalBottomSheet<void>(
                context: context,
                isScrollControlled: true,
                backgroundColor: AppColors.bgElevated,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (ctx) => Padding(
                  padding: EdgeInsets.only(bottom: MediaQuery.of(ctx).viewInsets.bottom + 20, left: 20, right: 20, top: 20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      const Text('Pegar lista', style: AppTextStyles.h2),
                      const SizedBox(height: 4),
                      const Text('host:puerto:usuario:clave  ·  o  usuario:clave@host:puerto', style: AppTextStyles.caption),
                      const SizedBox(height: 12),
                      TextField(controller: ctrl, maxLines: 6, style: AppTextStyles.mono),
                      const SizedBox(height: 14),
                      NeonButton(
                        label: 'Importar',
                        icon: Icons.download_rounded,
                        onPressed: () async {
                          final batch = <ProxyNode>[];
                          for (final line in ctrl.text.split(RegExp(r'[\r\n]+'))) {
                            final node = _parseProxyLine(line);
                            if (node != null) batch.add(node);
                          }
                          await ref.read(proxiesProvider.notifier).addAll(batch);
                          if (ctx.mounted) Navigator.pop(ctx);
                          _snack('${batch.length} proxies importados');
                        },
                      ),
                    ],
                  ),
                ),
              );

              _disposeLater([ctrl]);
            }

            ProxyNode? _parseProxyLine(String line) {
              var rest = line.trim();
              if (rest.isEmpty) return null;

              var user = '';
              var pass = '';

              if (rest.contains('@')) {
                final parts = rest.split('@');
                if (parts.length == 2) {
                  final cred = parts[0].split(':');
                  if (cred.length == 2) {
                    user = cred[0];
                    pass = cred[1];
                  }
                  rest = parts[1];
                }
              }

              final hp = rest.split(RegExp(r'[:\s]+')).where((s) => s.isNotEmpty).toList();
              if (hp.length < 2) return null;

              final port = int.tryParse(hp[1]) ?? 0;
              if (port == 0 || port > 65535) return null;

              if (user.isEmpty && hp.length >= 3) {
                user = hp[2];
                if (hp.length >= 4) pass = hp[3];
              }

              return ProxyNode(id: newId(), host: hp[0], port: port, user: user, pass: pass);
            }

            Future<void> _checkExits() async {
              final list = ref.read(proxiesProvider);
              if (list.isEmpty) return;

              final engine = CheckEngine(ref.read(settingsProvider));
              var cursor = 0;

              Future<void> w() async {
                while (true) {
                  final i = cursor;
                  if (i >= list.length) return;
                  cursor++;
                  final info = await engine.exitInfo(list[i]);
                  if (mounted) setState(() => _exit[list[i].id] = info ?? 'sin respuesta');
                }
              }

              await Future.wait(List.generate(4, (_) => w()));
              engine.dispose();
              _snack('IPs verificadas');
            }

            Future<void> _testAll() async {
              final list = ref.read(proxiesProvider);
              if (list.isEmpty) return;

              setState(() => _testing = true);

              final engine = CheckEngine(ref.read(settingsProvider));
              final results = <String, (ProxyHealth, int)>{};
              var cursor = 0;

              Future<void> worker() async {
                while (true) {
                  final i = cursor;
                  if (i >= list.length) return;
                  cursor++;
                  final out = await engine.probe(list[i]);
                  results[list[i].id] = (out.ok ? ProxyHealth.up : ProxyHealth.down, out.ms);
                }
              }

              await Future.wait(List.generate(6, (_) => worker()));
              engine.dispose();

              await ref.read(proxiesProvider.notifier).setHealthMany(results);

              if (!mounted) return;
              setState(() => _testing = false);

              final up = ref.read(proxiesProvider).where((p) => p.health == ProxyHealth.up).length;
              _snack('$up de ${list.length} funcionan');
            }

            @override
            Widget build(BuildContext context) {
              final list = ref.watch(proxiesProvider);
              final up = list.where((p) => p.health == ProxyHealth.up).length;

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('${list.length} cargados · $up funcionando', style: AppTextStyles.body),
                        const SizedBox(height: 4),
                        const Text('Se rotan por intento. Con "proxy fijo" se usa uno por corrida.', style: AppTextStyles.caption),
                        const SizedBox(height: 12),
                        Wrap(
                          spacing: 10,
                          runSpacing: 10,
                          children: [
                            NeonButton(
                              label: _testing ? 'probando' : 'Probar todos',
                              icon: Icons.speed,
                              onPressed: _testing ? null : _testAll,
                            ),
                            NeonButton(label: 'Agregar', icon: Icons.add, color: AppColors.cyan, onPressed: _add),
                            NeonButton(label: 'Pegar lista', icon: Icons.download_rounded, color: AppColors.violet, onPressed: _paste),
                            NeonButton(label: 'Ver IP de salida', icon: Icons.public, color: AppColors.cyan, onPressed: _checkExits),
                            NeonButton(
                              label: 'Borrar caidos',
                              icon: Icons.delete_sweep,
                              color: AppColors.red,
                              onPressed: () async {
                                final ids = list.where((p) => p.health == ProxyHealth.down).map((p) => p.id).toSet();
                                await ref.read(proxiesProvider.notifier).removeMany(ids);
                              },
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                  if (list.isEmpty)
                    const Padding(
                      padding: EdgeInsets.only(top: 40),
                      child: EmptyState(text: 'Sin proxies cargados', icon: Icons.lan_outlined),
                    )
                  else
                    ...list.map((p) {
                      final color = p.health == ProxyHealth.up
                          ? AppColors.lime
                          : p.health == ProxyHealth.down
                              ? AppColors.red
                              : AppColors.textLo;

                      return Padding(
                        padding: const EdgeInsets.only(top: 10),
                        child: GlassPanel(
                          child: Row(
                            children: [
                              Icon(
                                p.kind == ProxyKind.socks5 ? Icons.vpn_lock : Icons.language,
                                size: 18,
                                color: AppColors.textMid,
                              ),
                              const SizedBox(width: 12),
                              Expanded(
                                child: Column(
                                  crossAxisAlignment: CrossAxisAlignment.start,
                                  children: [
                                    Text(p.label, style: AppTextStyles.mono),
                                    Text(
                                      '${p.kind == ProxyKind.socks5 ? 'socks5' : 'http'} · '
                                      '${p.health == ProxyHealth.up ? '${p.latencyMs} ms' : p.health.name}'
                                      '${_exit[p.id] == null ? '' : ' · ${_exit[p.id]}'}',
                                      style: AppTextStyles.caption,
                                    ),
                                  ],
                                ),
                              ),
                              StatusPill(text: p.health == ProxyHealth.up ? 'ok' : p.health.name, color: color),
                              IconButton(
                                icon: const Icon(Icons.close, size: 16, color: AppColors.textLo),
                                onPressed: () => ref.read(proxiesProvider.notifier).remove(p.id),
                              ),
                            ],
                          ),
                        ),
                      );
                    }),
                ],
              );
            }
          }
