                                  : 'Cascada: cruza los dos. Viva solo si uno acepta; nunca marca muerta si hubo error de red.',
                          style: AppTextStyles.caption,
                        ),
                        if (s.engine != 'dorkill') ...[
                          const SizedBox(height: 12),
                          TextField(
                            controller: _skey,
                            style: AppTextStyles.mono,
                            onChanged: n.setStripeKey,
                            decoration: const InputDecoration(
