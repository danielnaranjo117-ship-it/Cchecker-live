          import 'core.dart';
          import 'models.dart';

          final _strong = RegExp(r'[|,;:\t=]+');
          final _weak = RegExp(r'\s+');

          List<String> _tokens(String line) {
            final out = <String>[];
            for (final chunk in line.split(_strong)) {
              for (final t in chunk.trim().split(_weak)) {
                if (t.isNotEmpty) out.add(t);
              }
            }
            return out;
          }

          (int, int)? _readDate(String d) {
            if (d.length == 4) {
              final a = int.parse(d.substring(0, 2));
              final b = int.parse(d.substring(2));
              if (a >= 1 && a <= 12) return (a, b);
              if (b >= 1 && b <= 12) return (b, a);
              return null;
            }
            if (d.length == 6) {
              final a = int.parse(d.substring(0, 2));
              if (a >= 1 && a <= 12) return (a, int.parse(d.substring(4)));
              return null;
            }
            if (d.length == 5) {
              final a = int.parse(d.substring(0, 2));
              if (a >= 1 && a <= 12) return (a, int.parse(d.substring(3)));
              return null;
            }
            return null;
          }

          int? _readMonth(String d) {
            if (d.length >= 1 && d.length <= 2) {
              final v = int.parse(d);
              if (v >= 1 && v <= 12) return v;
            }
            return null;
          }

          int? _readYear(String d) {
            if (d.length == 4) return int.parse(d.substring(2));
            if (d.length <= 2) return int.parse(d);
            return null;
          }

          ImportResult parseCards(String input, {bool repairLuhn = true, bool strictScheme = false}) {
            final out = <CreditCard>[];
            final seen = <String>{};
            var dup = 0;
            var junk = 0;
            var fixed = 0;
            var exp = 0;

            for (final rawLine in input.split(RegExp(r'[\r\n]+'))) {
              final line = rawLine.trim();
              if (line.isEmpty) continue;

              final tok = _tokens(line);
              if (tok.isEmpty) {
                junk++;
                continue;
              }

              String? pan;
              var pStart = -1;
              var pEnd = -1;

              for (var i = 0; i < tok.length && pan == null; i++) {
                var merged = digitsOf(tok[i]);
                if (merged.isEmpty) continue;
                var j = i;
                while (j + 1 < tok.length) {
                  final nxt = tok[j + 1];
                  if (!isDigits(nxt)) break;
                  if (merged.length + nxt.length > 19) break;
                  final cont = merged.length < 12 ? nxt.length <= 6 : (nxt.length == 4 && merged.length % 4 == 0);
                  if (!cont) break;
                  merged += nxt;
                  j++;
                }
                if (merged.length >= 12 && merged.length <= 19) {
                  pan = merged;
                  pStart = i;
                  pEnd = j;
                }
              }

              if (pan == null) {
                junk++;
                continue;
              }

              var mm = 0;
              var yy = 0;
              var cvv = '';

              for (var i = 0; i < tok.length; i++) {
                if (i >= pStart && i <= pEnd) continue;
                final t = tok[i];
                final d = digitsOf(t);
                if (d.isEmpty || hasAlpha(t)) continue;

                if (mm == 0) {
                  final rd = _readDate(d);
                  if (rd != null) {
                    mm = rd.$1;
                    yy = rd.$2;
                    continue;
                  }
                  final m = _readMonth(d);
                  if (m != null) {
                    mm = m;
                    continue;
                  }
                  if (d.length == 2 || d.length == 4) {
                    final y = _readYear(d);
                    if (y != null) {
                      yy = y;
                      continue;
                    }
                  }
                }

                if (mm != 0 && yy == 0 && (d.length == 2 || d.length == 4)) {
                  final y = _readYear(d);
                  if (y != null) {
                    yy = y;
                    continue;
                  }
                }

                if (cvv.isEmpty && (d.length == 3 || d.length == 4)) cvv = d;
              }

              if (mm == 0) mm = 12;
              if (yy == 0) yy = (DateTime.now().year + 4) % 100;

              if (repairLuhn && !luhn(pan)) {
                final f = fixLuhn(pan);
                if (f != pan) {
                  pan = f;
                  fixed++;
                }
              }

              if (strictScheme && schemeOf(pan) == 'otra') {
                junk++;
                continue;
              }

              if (seen.contains(pan)) {
                dup++;
                continue;
              }
              seen.add(pan);

              final card = CreditCard(
                id: newId(),
                pan: pan,
                expMonth: mm,
                expYear: yy,
                cvv: cvv,
                brand: schemeOf(pan),
                bin: pan.length >= 6 ? pan.substring(0, 6) : pan,
              );
              if (card.expired) exp++;
              out.add(card);
            }

            return ImportResult(cards: out, duplicates: dup, junk: junk, fixed: fixed, expired: exp);
          }
