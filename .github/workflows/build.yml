            static CheckResult mapDorkillText(String raw, int ms) {
              final s = raw.toLowerCase();
              CheckResult r(CheckStatus st, String m) =>
                  CheckResult(status: st, message: m, gateway: 'dorkill', latencyMs: ms);

              if (s.contains('insufficient') || s.contains('no fund') || s.contains('not enough')) return r(CheckStatus.noFunds, 'sin fondos');
              if (s.contains('3ds') || s.contains('authenticat') || s.contains('otp')) return r(CheckStatus.need3ds, 'pide 3ds');
              if (s.contains('cvc') || s.contains('cvv') || s.contains('security code')) return r(CheckStatus.cvcFail, 'cvv incorrecto');
              if (s.contains('zip') || s.contains('postal') || s.contains('avs')) return r(CheckStatus.avsFail, 'zip incorrecto');
              if (s.contains('do not honor') || s.contains('restrict') || s.contains('not allowed')) return r(CheckStatus.restricted, 'emisor la bloquea');
              if (s.contains('lost')) return r(CheckStatus.dead, 'reportada perdida');
              if (s.contains('stolen')) return r(CheckStatus.dead, 'reportada robada');
              if (s.contains('expired')) return r(CheckStatus.dead, 'vencida');
              if (s.contains('invalid') || s.contains('declin')) return r(CheckStatus.dead, 'declinada');
              return r(CheckStatus.unknown, 'sin clasificar');
            }

            Future<CheckResult> check(CreditCard card) async {
              final max = cfg.retries + 1;
              var last = const CheckResult(status: CheckStatus.unknown, message: 'sin intentos');

              for (var attempt = 0; attempt < max; attempt++) {
                final p = _pick();
                final r = _authOn
                    ? await _auth(card, p)
                    : cfg.engine == 'both'
                        ? await _cascade(card, p)
                        : cfg.engine == 'dorkill'
                            ? await _dorkill(card, p)
                            : await _stripe(card, p);

                last = r;
                if (r.status != CheckStatus.unknown) return r;
                if (attempt + 1 < max) {
                  await Future.delayed(Duration(milliseconds: NetSense.i.backoff(attempt + 1)));
                }
              }

              return last;
            }

            Future<CheckResult> _auth(CreditCard card, ProxyNode? p) async {
              final sw = Stopwatch()..start();
              const gw = 'auth';
              try {
                final r = await _client(p)
                    .post(
                      Uri.parse(stripePiUrl),
                      headers: {
                        'Authorization': 'Bearer ${cfg.stripeSk}',
                        'Content-Type': 'application/x-www-form-urlencoded',
                      },
                      body: {
                        'amount': '$_authCents',
                        'currency': 'usd',
                        'capture_method': 'manual',
                        'confirm': 'true',
                        'automatic_payment_methods[enabled]': 'false',
                        'payment_method_data[type]': 'card',
                        'payment_method_data[card][number]': card.pan,
                        'payment_method_data[card][exp_month]': card.expMonth.toString().padLeft(2, '0'),
                        'payment_method_data[card][exp_year]': card.expYear.toString().padLeft(2, '0'),
                        'payment_method_data[card][cvc]': card.cvv,
                      },
                    )
                    .timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();

                final ms = sw.elapsedMilliseconds;
                final body = r.body.isEmpty ? <String, dynamic>{} : jsonDecode(r.body) as Map<String, dynamic>;

                if (r.statusCode == 200) {
                  final st = (body['status'] ?? '').toString();
                  if (st == 'requires_capture' || st == 'succeeded') {
                    return CheckResult(
                      status: CheckStatus.live,
                      message: 'autorizada \$${(_authCents / 100).toStringAsFixed(2)}',
                      gateway: gw,
                      latencyMs: ms,
                    );
                  }
                  if (st == 'requires_action') {
                    return CheckResult(status: CheckStatus.need3ds, message: 'pide 3ds', gateway: gw, latencyMs: ms);
                  }
                  if (st == 'processing') {
                    return CheckResult(status: CheckStatus.unknown, message: 'procesando', gateway: gw, latencyMs: ms);
                  }
                  return CheckResult(status: CheckStatus.unknown, message: 'estado $st', gateway: gw, latencyMs: ms);
                }

                if (r.statusCode == 401 || r.statusCode == 403) {
                  return CheckResult(status: CheckStatus.unknown, message: 'sk rechazada (${r.statusCode})', gateway: gw, latencyMs: ms);
                }
                if (r.statusCode == 429) {
                  return CheckResult(status: CheckStatus.unknown, message: 'limite de stripe (429)', gateway: gw, latencyMs: ms);
                }
                if (r.statusCode >= 500) {
                  return CheckResult(status: CheckStatus.unknown, message: 'stripe caido (${r.statusCode})', gateway: gw, latencyMs: ms);
                }

                final err = (body['error'] as Map?) ?? const <dynamic, dynamic>{};
                final mapped = mapStripe(
                  type: (err['type'] ?? '').toString(),
                  code: (err['code'] ?? '').toString(),
                  decline: (err['decline_code'] ?? '').toString(),
                  msg: (err['message'] ?? 'rechazada').toString(),
                  ms: ms,
                );
                return CheckResult(status: mapped.status, message: mapped.message, gateway: gw, latencyMs: ms);
              } catch (_) {
                sw.stop();
                return CheckResult(status: CheckStatus.unknown, message: 'red', gateway: gw, latencyMs: sw.elapsedMilliseconds);
              }
            }

            Future<CheckResult> _stripe(CreditCard card, ProxyNode? p) async {
              final a = await _stripeCall(_client(p), card, 0);

              if (a.message.startsWith('surface')) {
                return _stripeCall(_client(p), card, 1);
              }

              if (a.message == 'red' && cfg.doh && p == null) {
                final raw = IOClient(_bare());
                try {
                  final b = await _stripeCall(raw, card, 0);
                  if (b.status != CheckStatus.unknown) return b;
                } finally {
                  raw.close();
                }
              }

              return a;
            }

            Future<CheckResult> _stripeCall(http.Client client, CreditCard card, int which) async {
              final gw = which == 0 ? 'stripe' : 'stripe-pm';
              final sw = Stopwatch()..start();
              try {
                final r = await client
                    .post(
                      Uri.parse(_endpoints[which]),
                      headers: {
                        'Authorization': 'Bearer $_sk',
                        'Content-Type': 'application/x-www-form-urlencoded',
                      },
                      body: {
                        if (which == 1) 'type': 'card',
                        'card[number]': card.pan,
                        'card[exp_month]': card.expMonth.toString().padLeft(2, '0'),
                        'card[exp_year]': card.expYear.toString().padLeft(2, '0'),
                        'card[cvc]': card.cvv,
                      },
                    )
                    .timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();

                final ms = sw.elapsedMilliseconds;
                final body = r.body.isEmpty ? <String, dynamic>{} : jsonDecode(r.body) as Map<String, dynamic>;

                if (r.statusCode == 200 && body['id'] != null) {
                  final cm = body['card'] as Map?;
                  final brand = (cm?['brand'] ?? '').toString();
                  return CheckResult(
                    status: CheckStatus.live,
                    message: brand.isEmpty ? 'aprobada' : 'aprobada · $brand',
                    gateway: gw,
                    latencyMs: ms,
                  );
                }

                if (r.statusCode == 401 || r.statusCode == 403) {
                  return CheckResult(status: CheckStatus.unknown, message: 'key rechazada (${r.statusCode})', gateway: gw, latencyMs: ms);
                }
                if (r.statusCode == 429) {
                  return CheckResult(status: CheckStatus.unknown, message: 'limite de stripe (429)', gateway: gw, latencyMs: ms);
                }
                if (r.statusCode >= 500) {
                  return CheckResult(status: CheckStatus.unknown, message: 'stripe caido (${r.statusCode})', gateway: gw, latencyMs: ms);
                }
                if (r.statusCode == 400) {
                  final m = ((body['error'] as Map?)?['message'] ?? '').toString();
                  if (m.contains('unsupported')) {
                    return CheckResult(status: CheckStatus.unknown, message: 'surface de Stripe apagado', gateway: gw, latencyMs: ms);
                  }
                  return CheckResult(status: CheckStatus.unknown, message: 'http 400', gateway: gw, latencyMs: ms);
                }
                if (r.statusCode != 200 && r.statusCode != 402) {
                  return CheckResult(status: CheckStatus.unknown, message: 'http ${r.statusCode}', gateway: gw, latencyMs: ms);
                }

                final err = (body['error'] as Map?) ?? const <dynamic, dynamic>{};
                final mapped = mapStripe(
                  type: (err['type'] ?? '').toString(),
                  code: (err['code'] ?? '').toString(),
                  decline: (err['decline_code'] ?? '').toString(),
                  msg: (err['message'] ?? 'rechazada').toString(),
                  ms: ms,
                );
                return CheckResult(status: mapped.status, message: mapped.message, gateway: gw, latencyMs: ms);
              } catch (_) {
                sw.stop();
                return CheckResult(status: CheckStatus.unknown, message: 'red', gateway: gw, latencyMs: sw.elapsedMilliseconds);
              }
            }

            Future<CheckResult> _dorkill(CreditCard card, ProxyNode? p) async {
              if (cfg.dorkillKey.isEmpty) {
                return const CheckResult(status: CheckStatus.unknown, message: 'falta API key', gateway: 'dorkill');
              }

              final sw = Stopwatch()..start();
              try {
                final uri = Uri.parse(dorkillUrl).replace(queryParameters: {
                  'key': cfg.dorkillKey,
                  'card': '${card.pan}|${card.expMonth.toString().padLeft(2, '0')}|${year4(card.expYear)}|${card.cvv}',
                });
                final r = await _client(p).get(uri).timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();
                final ms = sw.elapsedMilliseconds;

                final body = r.body.isEmpty ? <String, dynamic>{} : jsonDecode(r.body) as Map<String, dynamic>;
                final status = (body['status'] ?? '').toString().toLowerCase();
                final resp = (body['response'] ?? '').toString();
                final binRaw = (body['bin'] ?? '').toString();

                final ok = status == 'valid' || status == 'live' || status == 'approved' || status == 'success';
                if (ok) {
                  return CheckResult(
                    status: CheckStatus.live,
                    message: resp.isEmpty ? 'aprobada' : resp,
                    gateway: 'dorkill',
                    latencyMs: ms,
                    binRaw: binRaw,
                  );
                }

                final mapped = mapDorkillText('$status $resp', ms);
                return CheckResult(
                  status: mapped.status,
                  message: mapped.message,
                  gateway: 'dorkill',
                  latencyMs: ms,
                  binRaw: binRaw,
                );
              } catch (_) {
                sw.stop();
                return CheckResult(status: CheckStatus.unknown, message: 'red', gateway: 'dorkill', latencyMs: sw.elapsedMilliseconds);
              }
            }

            Future<CheckResult> _cascade(CreditCard card, ProxyNode? p) async {
              final a = _authOn ? await _auth(card, p) : await _stripe(card, p);
              if (a.status != CheckStatus.unknown && a.status != CheckStatus.dead) return a;

              final b = await _dorkill(card, p);
              if (b.status == CheckStatus.unknown) return a;
              if (a.status == CheckStatus.unknown) return b;
              if (a.status == CheckStatus.dead && b.status != CheckStatus.dead) return b;
              if (b.status == CheckStatus.dead && a.status != CheckStatus.dead) return a;
              return a.status.rank <= b.status.rank ? a : b;
            }
          }
