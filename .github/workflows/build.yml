          import 'dart:convert';

          import 'checker.dart';
          import 'core.dart';
          import 'import_engine.dart';
          import 'models.dart';
          import 'scraper.dart';

          class FoundSource {
            FoundSource({
              required this.url,
              required this.name,
              required this.origin,
              this.cards = 0,
              this.bytes = 0,
              this.ms = 0,
              this.preview = const <CreditCard>[],
              this.error,
            });

            final String url;
            final String name;
            final String origin;
            final int cards;
            final int bytes;
            final int ms;
            final List<CreditCard> preview;
            final String? error;

            int checked = 0;
            int live = 0;
            int dead = 0;

            bool get ok => error == null && cards >= 3;
            double? get hitRate => checked == 0 ? null : live / checked;
          }

          const finderPresets = <(String, String)>[
            ('cc checker', 'cc checker'),
            ('credit card list', 'credit card list'),
            ('cc list', 'cc list'),
            ('bin list', 'bin list'),
            ('cc checker live', 'cc checker live'),
            ('combo', 'credit card combo'),
          ];

          const _commonPaths = <String>[
            'cc.txt',
            'ccs.txt',
            'cards.txt',
            'cc_list.txt',
            'list.txt',
            'combo.txt',
            'data/cc.txt',
            'ccs/cc.txt',
          ];

          class SourceFinder {
            SourceFinder(this.engine, {this.token = ''});

            final CheckEngine engine;
            final String token;

            static const _api = 'https://api.github.com';

            Map<String, String> get _h => {
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  if (token.isNotEmpty) 'Authorization': 'Bearer $token',
                };

            static bool isRate(Object e) {
              final s = e.toString();
              return s.contains('403') || s.contains('429');
            }

            Future<List<FoundSource>> search({
              required String query,
              int maxRepos = 8,
              bool includeGists = true,
              void Function(String step, int done, int total)? onStep,
            }) async {
              final urls = <String, String>{};

              onStep?.call('buscando repos', 0, 1);

              final repos = await _searchRepos(query, maxRepos);
              if (repos.isEmpty) onStep?.call('sin repos para esa busqueda', 0, 1);

              var rates = 0;
              var i = 0;

              for (final r in repos) {
                i++;
                final full = (r['full_name'] ?? '').toString();
                final branch = (r['default_branch'] ?? 'main').toString();
                if (full.isEmpty) continue;

                onStep?.call('revisando $full', i, repos.length);

                for (final p in _commonPaths.take(5)) {
                  urls.putIfAbsent('https://raw.githubusercontent.com/$full/$branch/$p', () => full);
                }

                try {
                  for (final p in await _repoFiles(full, branch)) {
                    urls.putIfAbsent('https://raw.githubusercontent.com/$full/$branch/$p', () => full);
                  }
                  rates = 0;
                } catch (e) {
                  if (isRate(e)) {
                    rates++;
                    if (rates >= 2) {
                      onStep?.call('GitHub te limito, sigo con lo que tengo', i, repos.length);
                      break;
                    }
                  }
                }

                await Future.delayed(const Duration(milliseconds: 150));
              }

              if (includeGists) {
                onStep?.call('gists publicos', 0, 1);
                try {
                  for (final u in await _publicGists()) {
                    urls.putIfAbsent(u, () => 'gist');
                  }
                } catch (_) {}
              }

              return _probeAll(urls, onStep);
            }

            Future<void> scoreAll(
              List<FoundSource> list, {
              int sample = 10,
              int maxSources = 12,
              void Function(String step, int done, int total)? onStep,
            }) async {
              final targets = list.take(maxSources).toList();
              if (targets.isEmpty) return;

              final cfg = engine.cfg.engine == 'stripe' ? engine.cfg : engine.cfg.copyWith(engine: 'stripe');
              final scorer = CheckEngine(cfg, proxies: engine.proxies);

              var total = 0;
              for (final f in targets) {
                total += f.preview.length < sample ? f.preview.length : sample;
              }

              var done = 0;

              try {
                for (final f in targets) {
                  final cards = f.preview.take(sample).toList();
                  if (cards.isEmpty) continue;

                  var cursor = 0;
                  var live = 0;
                  var dead = 0;

                  Future<void> worker() async {
                    while (true) {
                      final i = cursor;
                      if (i >= cards.length) return;
                      cursor++;

                      try {
                        final r = await scorer.check(cards[i]);
                        if (r.status == CheckStatus.live) live++;
                        if (r.status == CheckStatus.dead) dead++;
                      } catch (_) {}

                      done++;
                      onStep?.call('puntuando ${f.name}', done, total);
                    }
                  }

                  await Future.wait(List.generate(4, (_) => worker()));
                  f.checked = cards.length;
                  f.live = live;
                  f.dead = dead;
                }
              } finally {
                scorer.dispose();
              }
            }

            Future<List<Map<String, dynamic>>> _searchRepos(String q, int perPage) async {
              final uri = Uri.parse('$_api/search/repositories').replace(queryParameters: {
                'q': q,
                'sort': 'updated',
                'order': 'desc',
                'per_page': '${perPage.clamp(1, 30)}',
              });

              final raw = await engine.fetchText(uri.toString(), headers: _h, maxBytes: 1024 * 1024);
              final j = jsonDecode(raw) as Map<String, dynamic>;
              final items = (j['items'] as List?) ?? const <dynamic>[];
              return items.map((e) => (e as Map).cast<String, dynamic>()).toList();
            }

            Future<List<String>> _repoFiles(String full, String branch) async {
              final raw = await engine.fetchText(
                '$_api/repos/$full/git/trees/$branch?recursive=1',
                headers: _h,
                maxBytes: 8 * 1024 * 1024,
              );
              final j = jsonDecode(raw) as Map<String, dynamic>;
              final tree = (j['tree'] as List?) ?? const <dynamic>[];
              final out = <String>[];

              for (final e in tree) {
                final m = (e as Map).cast<String, dynamic>();
                if ((m['type'] ?? '') != 'blob') continue;

                final path = (m['path'] ?? '').toString();
                final size = ((m['size'] ?? 0) as num).toInt();
                if (size < 200 || size > 6 * 1024 * 1024) continue;

                final low = path.toLowerCase();
                if (!(low.endsWith('.txt') ||
                    low.endsWith('.csv') ||
                    low.endsWith('.dat') ||
                    low.endsWith('.list') ||
                    low.endsWith('.json'))) {
                  continue;
                }

                final base = low.split('/').last;
                final hit = base.contains('cc') ||
                    base.contains('card') ||
                    base.contains('bin') ||
                    base.contains('list') ||
                    base.contains('combo') ||
                    base.contains('live');
                if (!hit) continue;

                out.add(path);
                if (out.length >= 4) break;
              }
              return out;
            }

            Future<List<String>> _publicGists() async {
              final raw = await engine.fetchText(
                '$_api/gists/public?per_page=60',
                headers: _h,
                maxBytes: 4 * 1024 * 1024,
              );
              final list = jsonDecode(raw) as List;
              final out = <String>[];

              for (final g in list) {
                final files = (g as Map)['files'] as Map?;
                if (files == null) continue;
                for (final f in files.values) {
                  final m = f as Map;
                  final url = (m['raw_url'] ?? '').toString();
                  final size = ((m['size'] ?? 0) as num).toInt();
                  if (url.isEmpty || size < 200 || size > 2 * 1024 * 1024) continue;
                  out.add(url);
                }
              }
              return out;
            }

            Future<List<FoundSource>> _probeAll(
              Map<String, String> urls,
              void Function(String, int, int)? onStep,
            ) async {
              final list = urls.entries.take(90).toList();
              final out = <FoundSource>[];
              var cursor = 0;
              var done = 0;

              Future<void> worker() async {
                while (true) {
                  final i = cursor;
                  if (i >= list.length) return;
                  cursor++;

                  final f = await _probe(list[i].key, list[i].value);
                  done++;
                  if (f.ok) out.add(f);
                  onStep?.call('probando', done, list.length);
                }
              }

              await Future.wait(List.generate(8, (_) => worker()));
              out.sort((a, b) => b.cards.compareTo(a.cards));
              return out;
            }

            Future<FoundSource> _probe(String url, String origin) async {
              final sw = Stopwatch()..start();
              final name = Uri.tryParse(url)?.pathSegments.last ?? url;

              try {
                final body = await engine.fetchText(url, maxBytes: 160 * 1024);
                final res = parseCards(Scraper.bodyToText(body), repairLuhn: false, strictScheme: true);
                final good = res.cards.where((c) => luhn(c.pan)).toList();

                return FoundSource(
                  url: url,
                  name: name,
                  origin: origin,
                  cards: good.length,
                  bytes: body.length,
                  ms: sw.elapsedMilliseconds,
                  preview: good.take(60).toList(),
                );
              } catch (e) {
                return FoundSource(
                  url: url,
                  name: name,
                  origin: origin,
                  ms: sw.elapsedMilliseconds,
                  error: Scraper.shortError(e),
                );
              }
            }
          }
