            void applyBatch(Map<String, CheckResult> rs) {
              if (rs.isEmpty) return;
              final now = DateTime.now();

              state = state.map((c) {
                final r = rs[c.id];
                if (r == null) return c;

                var bank = c.bank;
                var country = c.country;
                var cardType = c.cardType;

                if (r.binRaw.isNotEmpty) {
                  final parts = r.binRaw.split(RegExp(r'\s*-\s*'));
                  for (final part in parts) {
                    final v = part.trim();
                    if (v.isEmpty) continue;
                    final low = v.toLowerCase();
                    if (low == 'credit' || low == 'debit' || low == 'prepaid') {
                      cardType = low;
                    } else if (v.length == 2 && hasAlpha(v)) {
                      country = v.toUpperCase();
                    } else if (bank.isEmpty) {
                      bank = v;
                    }
                  }
                }

                return c.copyWith(
                  status: r.status,
                  message: r.message,
                  gateway: r.gateway,
                  latencyMs: r.latencyMs,
                  checkedAt: now,
                  bank: bank,
                  country: country,
                  cardType: cardType,
                );
              }).toList();
            }
