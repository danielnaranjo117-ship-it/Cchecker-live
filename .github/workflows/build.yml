          class _SettingsScreenState extends ConsumerState<SettingsScreen> {
            late final TextEditingController _skey;
            late final TextEditingController _dkey;
            late final TextEditingController _ssk;
            late final TextEditingController _pass;

            List<CheckOutcome> _results = [];
