            String _decrypt(String blob) {
              final parts = blob.split(':');
              if (parts.length != 2) return blob;
              final key = enc.Key.fromUtf8(_key());
              final e = enc.Encrypter(enc.AES(key, mode: enc.AESMode.cbc));
              return e.decrypt64(parts[1], iv: enc.IV.fromBase64(parts[0]));
            }
