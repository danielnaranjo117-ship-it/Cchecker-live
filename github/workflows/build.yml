            final Settings cfg;
            final List<ProxyNode> _proxies;
            final _rnd = Random();
            final _clients = <String, http.Client>{};

            http.Client _client(ProxyNode? p) {
              final key = p == null ? 'direct' : '${p.kind.name}|${p.host}:${p.port}';

              final cached = _clients[key];
              if (cached != null) return cached;

              final hc = HttpClient()
                ..connectionTimeout = Duration(seconds: cfg.timeoutSec)
                ..idleTimeout = const Duration(seconds: 20);

              if (p != null) {
                hc.findProxy = (_) =>
                    p.kind == ProxyKind.socks5 ? 'SOCKS ${p.host}:${p.port}' : 'PROXY ${p.host}:${p.port}';

                if (p.user.isNotEmpty) {
                  final user = p.user;
                  final pass = p.pass;
                  hc.authenticateProxy = (host, port, scheme, realm) {
                    hc.addProxyCredentials(host, port, realm, HttpClientBasicCredentials(user, pass));
                    return true;
                  };
                  hc.authenticate = (uri, scheme, realm) {
                    hc.addCredentials(uri, realm, HttpClientBasicCredentials(user, pass));
                    return true;
                  };
                }
              } else if (cfg.doh) {
                hc.connectionFactory = _viaDoh;
              }

              final c = IOClient(hc);
              _clients[key] = c;
              return c;
