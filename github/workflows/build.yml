          import 'dart:async';
          import 'dart:isolate';

          import 'checker.dart';
          import 'models.dart';

          class MassRunner {
            MassRunner({
              required this.cards,
              required this.settings,
              required this.proxies,
              required this.onResult,
              required this.onProgress,
            });

            final List<CreditCard> cards;
            final Settings settings;
            final List<ProxyNode> proxies;
            final void Function(String id, CheckResult r) onResult;
            final void Function(int done, int total, int live, int dead, int errors) onProgress;

            final ReceivePort _inbox = ReceivePort();
            final List<_W> _workers = [];
            final List<SendPort> _idle = [];

            int _cursor = 0;
            int _active = 0;
            int _done = 0;
            int _live = 0;
            int _dead = 0;
            int _errors = 0;
            int _retire = 0;

            bool _paused = false;
            bool _stopped = false;
            Completer<void>? _finished;

            bool get paused => _paused;
            int get done => _done;
            int get total => cards.length;
            int get live => _live;
            int get dead => _dead;
            int get errors => _errors;

            Future<void> start({int concurrency = 6}) async {
              _finished = Completer<void>();
              _inbox.listen(_onMessage);

              final n = concurrency.clamp(1, 16).toInt();
              for (var i = 0; i < n; i++) {
                await _spawn();
              }

              await _finished!.future;
              await Future.delayed(const Duration(milliseconds: 80));
              _inbox.close();
            }

            Future<void> _spawn() async {
              final iso = await Isolate.spawn<List<dynamic>>(
                _workerMain,
                <dynamic>[_inbox.sendPort, settings.toJson(), proxies.map((p) => p.toJson()).toList()],
              );
              _workers.add(_W(iso));
            }

            void _onMessage(dynamic raw) {
              final m = (raw as Map).cast<String, dynamic>();
              final t = m['t'] as String;

              if (t == 'ready') {
                final p = m['port'] as SendPort;
                for (final w in _workers) {
                  if (w.port == null) {
                    w.port = p;
                    break;
                  }
                }
                _idle.add(p);
                _pump();
                return;
              }

              if (t == 'next') {
                _idle.add(m['port'] as SendPort);
                _pump();
                return;
              }

              if (t == 'result') {
                _active--;
                _done++;

                final st = m['status'] as String;
                if (st == 'live') _live++;
                if (st == 'dead') _dead++;
                if (st == 'unknown') _errors++;

                onResult(
                  m['id'] as String,
                  CheckResult(
                    status: CheckStatus.values.firstWhere((s) => s.name == st, orElse: () => CheckStatus.unknown),
                    message: (m['msg'] ?? '').toString(),
                    gateway: (m['gw'] ?? '').toString(),
                    latencyMs: ((m['ms'] ?? 0) as num).toInt(),
                  ),
                );

                onProgress(_done, cards.length, _live, _dead, _errors);
                _maybeFinish();
              }
            }

            void _pump() {
              while (_idle.isNotEmpty) {
                if (_stopped) {
                  _idle.removeAt(0).send(<String, dynamic>{'t': 'end'});
                  continue;
                }
                if (_paused) return;

                if (_retire > 0 && _workers.length > 1) {
                  _retire--;
                  final p = _idle.removeAt(0);
                  p.send(<String, dynamic>{'t': 'end'});
                  _workers.removeWhere((w) => w.port == p);
                  continue;
                }

                if (_cursor >= cards.length) {
                  _idle.removeAt(0).send(<String, dynamic>{'t': 'end'});
                  continue;
                }

                final card = cards[_cursor++];
                _active++;
                _idle.removeAt(0).send(<String, dynamic>{'t': 'job', 'card': card.toJson()});
              }

              _maybeFinish();
            }

            void _maybeFinish() {
              if (_stopped) return;
              if (_done < cards.length) return;

              final f = _finished;
              if (f == null || f.isCompleted) return;

              for (final w in _workers) {
                w.port?.send(<String, dynamic>{'t': 'end'});
              }
              f.complete();
            }

            void pause() => _paused = true;

            void resume() {
              if (_stopped) return;
              _paused = false;
              _pump();
            }

            void stop() {
              _stopped = true;
              _paused = false;

              for (final w in _workers) {
                w.port?.send(<String, dynamic>{'t': 'end'});
              }
              for (final w in _workers) {
                w.isolate.kill(priority: Isolate.immediate);
              }

              _workers.clear();
              _idle.clear();

              final f = _finished;
              if (f != null && !f.isCompleted) f.complete();
            }

            Future<void> setConcurrency(int n) async {
              final target = n.clamp(1, 16).toInt();
              if (_stopped) return;

              if (target > _workers.length) {
                _retire = 0;
                for (var i = _workers.length; i < target; i++) {
                  await _spawn();
                }
              } else if (target < _workers.length) {
                _retire = _workers.length - target;
                _pump();
              }
            }
          }

          class _W {
            _W(this.isolate);
            final Isolate isolate;
            SendPort? port;
          }

          Future<void> _workerMain(List<dynamic> args) async {
            final toMain = args[0] as SendPort;
            final cfg = (args[1] as Map).cast<String, dynamic>();
            final px = args[2] as List<dynamic>;

            final settings = Settings.fromJson(cfg);
            final proxies = px.map((e) => ProxyNode.fromJson((e as Map).cast<String, dynamic>())).toList();
            final engine = CheckEngine(settings, proxies: proxies);

            final inbox = ReceivePort();
            toMain.send(<String, dynamic>{'t': 'ready', 'port': inbox.sendPort});

            inbox.listen((dynamic msg) async {
              final m = (msg as Map).cast<String, dynamic>();
              final t = m['t'] as String;

              if (t == 'job') {
                final card = CreditCard.fromJson((m['card'] as Map).cast<String, dynamic>());

                CheckResult r;
                try {
                  r = await engine.check(card);
                } catch (_) {
                  r = const CheckResult(status: CheckStatus.unknown, message: 'error interno');
                }

                toMain.send(<String, dynamic>{
                  't': 'result',
                  'id': card.id,
                  'status': r.status.name,
                  'msg': r.message,
                  'gw': r.gateway,
                  'ms': r.latencyMs,
                });
                toMain.send(<String, dynamic>{'t': 'next'});
              } else if (t == 'end') {
                engine.dispose();
                inbox.close();
                Isolate.exit();
              }
            });
          }
