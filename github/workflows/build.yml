              await _sp!.setString('vault_salt', salt);
              await _sp!.setString('vault_hash', _hash(pass, salt));
              _pass = pass;
              _unlocked = true;
              await save();
            }

            String? get storedPass {
              final v = _sp?.getString('vault_bio');
              if (v == null || v.isEmpty) return null;
