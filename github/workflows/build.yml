                  stats.setPaused(true);
                } else if (NetSense.i.online && _autoPaused) {
                  _autoPaused = false;
                  r.resume();
                  stats.setPaused(false);
                }

                if (settings.autoTune && NetSense.i.online) {
                  r.setConcurrency(NetSense.i.concurrency);
                }
              });

              try {
                await runner.start(concurrency: conc);
              } finally {
                flush.cancel();

                if (buffer.isNotEmpty) {
                  cards.applyBatch(Map<String, CheckResult>.of(buffer));
                  buffer.clear();
                }

                await _netSub?.cancel();
                _netSub = null;
                _runner = null;
                stats.setPaused(false);
