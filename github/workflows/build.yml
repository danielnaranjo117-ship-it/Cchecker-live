          class AnalysisScreen extends ConsumerStatefulWidget {
            const AnalysisScreen({super.key});
            @override
            ConsumerState<AnalysisScreen> createState() => _AnalysisScreenState();
          }

          class _AnalysisScreenState extends ConsumerState<AnalysisScreen> {
            String _note = '';

            void _snack(String m) {
              if (!mounted) return;
              setState(() => _note = m);
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            Future<void> _dedupe() async {
              final seen = <String>{};
              final out = <CreditCard>[];
              var removed = 0;

              for (final c in ref.read(cardsProvider)) {
                if (!seen.add(c.pan)) {
                  removed++;
                  continue;
                }
                out.add(c);
              }

              await ref.read(cardsProvider.notifier).replaceAll(out);
              _snack('$removed duplicadas eliminadas');
            }

            Future<void> _repairLuhn() async {
              var n = 0;
              final out = ref.read(cardsProvider).map((c) {
                if (luhn(c.pan)) return c;
                final fixed = fixLuhn(c.pan);
                if (fixed == c.pan) return c;
                n++;
                return c.copyWith(pan: fixed, brand: schemeOf(fixed));
              }).toList();

              await ref.read(cardsProvider.notifier).replaceAll(out);
              _snack('$n numeros reparados');
            }

            Future<void> _export(String format) async {
              final all = ref.read(cardsProvider);
              if (all.isEmpty) {
                _snack('Boveda vacia');
                return;
              }

              final String body;
              final String name;

              switch (format) {
                case 'json':
                  body = const JsonEncoder.withIndent('  ').convert(all.map((c) => c.toJson()).toList());
                  name = 'boveda.json';
                  break;
                case 'txt':
                  body = all.map((c) => c.line).join('\n');
                  name = 'boveda.txt';
                  break;
                default:
                  final b = StringBuffer('pan|mm|yy|cvv|marca|banco|pais|tipo|nivel|estado\n');
                  for (final c in all) {
                    b.write('${c.pan}|${c.expMonth}|${c.expYear}|${c.cvv}|${c.brand}|'
                        '${c.bank}|${c.country}|${c.cardType}|${c.level}|${c.status.label}\n');
                  }
                  body = b.toString();
                  name = 'boveda.csv';
              }

              try {
                final dir = await getApplicationDocumentsDirectory();
                final f = File('${dir.path}/$name');
                await f.writeAsString(body, flush: true);
                await Share.shareXFiles([XFile(f.path)], text: 'CCheker Live · ${all.length} tarjetas');
                _snack('Exportado $name');
              } catch (_) {
                await Clipboard.setData(ClipboardData(text: body));
                _snack('Copiado al portapapeles');
              }
            }

            @override
            Widget build(BuildContext context) {
              final all = ref.watch(cardsProvider);
              final stats = ref.watch(statsProvider);

              final live = all.where((c) => c.status == CheckStatus.live).length;
              final dead = all.where((c) => c.status == CheckStatus.dead).length;
              final unknown = all.where((c) => c.status == CheckStatus.unknown).length;
              final unchecked = all.where((c) => c.status == CheckStatus.unchecked).length;
              final expired = all.where((c) => c.expired).length;
              final noLuhn = all.where((c) => !luhn(c.pan)).length;

              final byBrand = <String, List<int>>{};
              for (final c in all) {
                final b = c.brand.isEmpty ? 'sin marca' : c.brand;
                final e = byBrand.putIfAbsent(b, () => [0, 0]);
                e[0]++;
                if (c.status == CheckStatus.live) e[1]++;
              }
              final brands = byBrand.entries.toList()..sort((a, b) => b.value[0].compareTo(a.value[0]));

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Resumen de la boveda'),
                  Row(
                    children: [
                      StatCard(label: 'tarjetas', value: fmtInt(all.length)),
                      const SizedBox(width: 10),
                      StatCard(label: 'vivas', value: fmtInt(live), color: AppColors.lime),
                      const SizedBox(width: 10),
                      StatCard(label: 'tasa', value: fmtPct(all.isEmpty ? 0 : live / all.length), color: AppColors.cyan),
                    ],
                  ),
                  const SizedBox(height: 10),
                  Row(
                    children: [
                      StatCard(label: 'muertas', value: fmtInt(dead), color: AppColors.red),
                      const SizedBox(width: 10),
                      StatCard(label: 'inciertas', value: fmtInt(unknown), color: AppColors.grey),
                      const SizedBox(width: 10),
                      StatCard(label: 'sin revisar', value: fmtInt(unchecked), color: AppColors.textMid),
                    ],
                  ),
                  const SectionHeader('Ultima corrida'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('${fmtInt(stats.done)} de ${fmtInt(stats.total)} revisadas', style: AppTextStyles.body),
                        const SizedBox(height: 6),
                        Text(
                          '${fmtInt(stats.live)} vivas · ${fmtInt(stats.dead)} muertas · ${fmtInt(stats.errors)} errores',
                          style: AppTextStyles.caption,
                        ),
                        const SizedBox(height: 10),
                        SegmentedProgress(value: stats.pct),
                        const SizedBox(height: 6),
                        Text('Tasa de acierto: ${fmtPct(stats.hitRate)}', style: AppTextStyles.caption),
                      ],
                    ),
                  ),
                  const SectionHeader('Por marca'),
                  GlassPanel(
                    child: brands.isEmpty
                        ? const Text('Sin datos.', style: AppTextStyles.caption)
                        : Column(
                            children: brands.take(10).map((e) {
                              final total = e.value[0];
                              final lv = e.value[1];
                              return Padding(
                                padding: const EdgeInsets.symmetric(vertical: 5),
                                child: Row(
                                  children: [
                                    SizedBox(
                                      width: 100,
                                      child: Text(e.key, style: AppTextStyles.caption, maxLines: 1, overflow: TextOverflow.ellipsis),
                                    ),
                                    Expanded(
                                      child: ClipRRect(
                                        borderRadius: BorderRadius.circular(4),
                                        child: LinearProgressIndicator(
                                          value: total == 0 ? 0 : lv / total,
                                          minHeight: 8,
                                          backgroundColor: AppColors.glass,
                                          valueColor: const AlwaysStoppedAnimation<Color>(AppColors.lime),
                                        ),
                                      ),
                                    ),
                                    const SizedBox(width: 8),
                                    Text('$lv/$total', style: AppTextStyles.tiny),
                                  ],
                                ),
                              );
                            }).toList(),
                          ),
                  ),
                  const SectionHeader('Mantenimiento'),
                  GlassPanel(
                    child: Column(
                      crossAxisAlignment: CrossAxisAlignment.start,
                      children: [
                        Text('$noLuhn numeros con Luhn invalido · $expired vencidas', style: AppTextStyles.caption),
                        const SizedBox(height: 12),
                        Wrap(
                          spacing: 10,
                          runSpacing: 10,
                          children: [
                            NeonButton(label: 'Reparar Luhn', icon: Icons.build_outlined, color: AppColors.cyan, onPressed: _repairLuhn),
                            NeonButton(label: 'Quitar duplicadas', icon: Icons.filter_alt_off_outlined, color: AppColors.amber, onPressed: _dedupe),
                            NeonButton(
                              label: 'Vencidas a muertas',
                              icon: Icons.event_busy,
                              color: AppColors.violet,
                              onPressed: () async {
                                final out = ref
                                    .read(cardsProvider)
                                    .map((c) => c.expired ? c.copyWith(status: CheckStatus.dead) : c)
                                    .toList();
                                await ref.read(cardsProvider.notifier).replaceAll(out);
                                _snack('$expired marcadas');
                              },
                            ),
                          ],
                        ),
                      ],
                    ),
                  ),
                  const SectionHeader('Exportar'),
                  GlassPanel(
                    child: Wrap(
                      spacing: 10,
                      runSpacing: 10,
                      children: [
                        NeonButton(label: 'CSV', icon: Icons.table_chart_outlined, onPressed: () => _export('csv')),
                        NeonButton(label: 'TXT', icon: Icons.notes, color: AppColors.cyan, onPressed: () => _export('txt')),
                        NeonButton(label: 'JSON', icon: Icons.data_object, color: AppColors.violet, onPressed: () => _export('json')),
                      ],
                    ),
                  ),
                  if (_note.isNotEmpty)
                    Padding(
                      padding: const EdgeInsets.only(top: 14),
                      child: Text(_note, style: AppTextStyles.caption),
                    ),
                ],
              );
            }
          }
