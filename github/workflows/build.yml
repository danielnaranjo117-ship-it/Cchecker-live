          class VaultScreen extends ConsumerStatefulWidget {
            const VaultScreen({super.key});
            @override
            ConsumerState<VaultScreen> createState() => _VaultScreenState();
          }

          class _VaultScreenState extends ConsumerState<VaultScreen> {
            final _sel = <String>{};
            final _q = TextEditingController();
            bool _selecting = false;
            CheckStatus? _filter;

            @override
            void dispose() {
              _q.dispose();
              super.dispose();
            }

            void _snack(String m) {
              if (!mounted) return;
              ScaffoldMessenger.of(context).showSnackBar(SnackBar(content: Text(m)));
            }

            Future<void> _copySelected() async {
              final all = ref.read(cardsProvider);
              final txt = all.where((c) => _sel.contains(c.id)).map((c) => c.line).join('\n');
              await Clipboard.setData(ClipboardData(text: txt));
              _snack('${_sel.length} lineas copiadas');
            }

            Future<void> _deleteSelected() async {
              final n = _sel.length;
              await ref.read(cardsProvider.notifier).removeMany(Set<String>.of(_sel));
              setState(() {
                _sel.clear();
                _selecting = false;
              });
              _snack('$n borradas');
            }

            Future<void> _enrichSelected() async {
              await BinDb.i.loadIndex();

              final all = ref.read(cardsProvider);
              final notifier = ref.read(cardsProvider.notifier);

              final out = <CreditCard>[];
              var hits = 0;

              for (final c in all) {
                if (!_sel.contains(c.id)) {
                  out.add(c);
                  continue;
                }
                final info = BinDb.i.lookup(c.pan);
                if (info == null) {
                  out.add(c);
                  continue;
                }
                hits++;
                out.add(c.copyWith(
                  bank: info.bank,
                  country: info.country,
                  cardType: info.cardType,
                  level: info.level,
                ));
              }

              await notifier.replaceAll(out);
              _snack(hits == 0 ? 'Sin coincidencias en la base' : '$hits enriquecidas');
            }

            @override
            Widget build(BuildContext context) {
              final all = ref.watch(cardsProvider);
              final q = _q.text.trim().toLowerCase();

              final list = all.where((c) {
                if (_filter != null && c.status != _filter) return false;
                if (q.isEmpty) return true;
                return c.pan.contains(q) ||
                    c.bank.toLowerCase().contains(q) ||
                    c.country.toLowerCase().contains(q) ||
                    c.bin.contains(q);
              }).toList();

              return Column(
                children: [
                  Padding(
                    padding: const EdgeInsets.fromLTRB(12, 10, 12, 0),
                    child: TextField(
                      controller: _q,
                      onChanged: (_) => setState(() {}),
                      style: AppTextStyles.mono,
                      decoration: InputDecoration(
                        hintText: 'Buscar pan, BIN, banco o pais',
                        hintStyle: AppTextStyles.caption,
                        prefixIcon: const Icon(Icons.search, size: 18, color: AppColors.textLo),
                        suffixIcon: q.isEmpty
                            ? null
                            : IconButton(
                                icon: const Icon(Icons.close, size: 16),
                                onPressed: () => setState(() => _q.clear()),
                              ),
                      ),
                    ),
                  ),
                  const RunBar(),
                  if (_selecting)
                    Container(
                      color: AppColors.bgElevated,
                      padding: const EdgeInsets.symmetric(horizontal: 8, vertical: 6),
                      child: Row(
                        children: [
                          Text('${_sel.length} sel.', style: AppTextStyles.body),
                          const Spacer(),
                          IconButton(
                            icon: const Icon(Icons.auto_awesome, size: 18),
                            onPressed: _enrichSelected,
                            tooltip: 'Completar datos',
                          ),
                          IconButton(icon: const Icon(Icons.copy_all, size: 18), onPressed: _copySelected, tooltip: 'Copiar'),
                          IconButton(
                            icon: const Icon(Icons.play_arrow, size: 18),
                            onPressed: () => ref.read(runProvider.notifier).run(ids: _sel.toList()),
                            tooltip: 'Revisar',
                          ),
                          IconButton(
                            icon: const Icon(Icons.delete_outline, size: 18, color: AppColors.red),
                            onPressed: _deleteSelected,
                          ),
                          IconButton(
                            icon: const Icon(Icons.close, size: 18),
                            onPressed: () => setState(() {
                              _sel.clear();
                              _selecting = false;
                            }),
                          ),
                        ],
                      ),
                    ),
                  _filterBar(all),
                  Expanded(
                    child: list.isEmpty
                        ? const EmptyState(text: 'Sin tarjetas con este filtro', icon: Icons.credit_card_off_outlined)
                        : ListView.builder(
                            padding: const EdgeInsets.fromLTRB(12, 8, 12, 90),
                            itemCount: list.length,
                            itemBuilder: (_, i) => _tile(list[i]),
                          ),
                  ),
                ],
              );
            }

            Widget _filterBar(List<CreditCard> all) {
              final counts = <CheckStatus, int>{};
              for (final c in all) {
                counts[c.status] = (counts[c.status] ?? 0) + 1;
              }

              return SizedBox(
                height: 46,
                child: ListView(
                  scrollDirection: Axis.horizontal,
                  padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 8),
                  children: [
                    _chip('todas', all.length, _filter == null, () => setState(() => _filter = null)),
                    for (final s in CheckStatus.values)
                      if ((counts[s] ?? 0) > 0)
                        _chip(s.label, counts[s]!, _filter == s, () => setState(() => _filter = _filter == s ? null : s)),
                  ],
                ),
              );
            }

            Widget _chip(String label, int n, bool on, VoidCallback tap) => Padding(
                  padding: const EdgeInsets.only(right: 8),
                  child: GestureDetector(
                    onTap: tap,
                    child: Container(
                      padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 6),
                      decoration: BoxDecoration(
                        color: on ? AppColors.lime.withOpacity(0.15) : AppColors.glass,
                        borderRadius: BorderRadius.circular(20),
                        border: Border.all(color: on ? AppColors.lime.withOpacity(0.5) : AppColors.glassStroke),
                      ),
                      child: Text(
                        '$label $n',
                        style: TextStyle(fontSize: 12, color: on ? AppColors.lime : AppColors.textMid),
                      ),
                    ),
                  ),
                );

            Widget _tile(CreditCard c) {
              final sel = _sel.contains(c.id);

              final color = switch (c.status) {
                CheckStatus.live => AppColors.lime,
                CheckStatus.dead => AppColors.red,
                CheckStatus.unknown => AppColors.grey,
                CheckStatus.checking => AppColors.cyan,
                CheckStatus.unchecked => AppColors.textLo,
              };

              return CardRow(
                selected: sel,
                onTap: () {
                  if (_selecting) {
                    setState(() {
                      if (!_sel.remove(c.id)) _sel.add(c.id);
                      if (_sel.isEmpty) _selecting = false;
                    });
                  } else {
                    _detail(c);
                  }
                },
                onLongPress: () => setState(() {
                  _selecting = true;
                  _sel.add(c.id);
                }),
                child: Row(
                  children: [
                    if (_selecting)
                      Padding(
                        padding: const EdgeInsets.only(right: 10),
                        child: Icon(
                          sel ? Icons.check_circle : Icons.circle_outlined,
                          size: 18,
                          color: sel ? AppColors.lime : AppColors.textLo,
                        ),
                      ),
                    Expanded(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(maskPan(c.pan), style: AppTextStyles.mono),
                          const SizedBox(height: 3),
                          Text(
                            '${schemeNames[c.brand] ?? c.brand} · ${c.expLabel} · ${c.cvv}'
                            '${c.bank.isEmpty ? '' : ' · ${c.bank}'}'
                            '${c.country.isEmpty ? '' : ' · ${flagEmoji(c.country)} ${c.country}'}',
                            style: AppTextStyles.caption,
                            maxLines: 1,
                            overflow: TextOverflow.ellipsis,
                          ),
                          if (c.message.isNotEmpty)
                            Text(
                              '${c.gateway} · ${c.message}${c.latencyMs > 0 ? ' · ${c.latencyMs}ms' : ''}',
                              style: AppTextStyles.tiny,
                              maxLines: 1,
                              overflow: TextOverflow.ellipsis,
                            ),
                        ],
                      ),
                    ),
                    const SizedBox(width: 8),
                    StatusPill(text: c.status.label, color: color),
                  ],
                ),
              );
            }

            void _detail(CreditCard c) {
              showModalBottomSheet<void>(
                context: context,
                backgroundColor: AppColors.bgElevated,
                shape: const RoundedRectangleBorder(borderRadius: BorderRadius.vertical(top: Radius.circular(20))),
                builder: (ctx) => Padding(
                  padding: const EdgeInsets.all(20),
                  child: Column(
                    mainAxisSize: MainAxisSize.min,
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      Text(maskPan(c.pan), style: AppTextStyles.h2),
                      const SizedBox(height: 14),
                      _row('Pan completo', c.pan),
                      _row('Vencimiento', c.expLabel),
                      _row('CVV', c.cvv),
                      _row('Marca', schemeNames[c.brand] ?? c.brand),
                      if (c.bank.isNotEmpty) _row('Banco', c.bank),
                      if (c.country.isNotEmpty)
                        _row('Pais', '${flagEmoji(c.country)} ${countryNames[c.country] ?? c.country}'),
                      if (c.cardType.isNotEmpty) _row('Tipo', c.cardType),
                      if (c.level.isNotEmpty) _row('Nivel', c.level),
                      _row('Estado', c.status.label),
                      if (c.message.isNotEmpty) _row('Respuesta', c.message),
                      if (c.checkedAt != null) _row('Revisada', c.checkedAt!.toLocal().toString().substring(0, 16)),
                      const SizedBox(height: 16),
                      Wrap(
                        spacing: 10,
                        runSpacing: 10,
                        children: [
                          NeonButton(
                            label: 'Copiar',
                            icon: Icons.copy,
                            onPressed: () async {
                              await Clipboard.setData(ClipboardData(text: c.line));
                              if (ctx.mounted) Navigator.pop(ctx);
                              _snack('Copiada');
                            },
                          ),
                          NeonButton(
                            label: 'Revisar',
                            icon: Icons.play_arrow,
                            color: AppColors.cyan,
                            onPressed: () {
                              Navigator.pop(ctx);
                              ref.read(runProvider.notifier).run(ids: [c.id]);
                            },
                          ),
                          NeonButton(
                            label: 'Borrar',
                            icon: Icons.delete_outline,
                            color: AppColors.red,
                            onPressed: () {
                              Navigator.pop(ctx);
                              ref.read(cardsProvider.notifier).remove(c.id);
                            },
                          ),
                        ],
                      ),
                    ],
                  ),
                ),
              );
            }

            Widget _row(String k, String v) => Padding(
                  padding: const EdgeInsets.symmetric(vertical: 4),
                  child: Row(
                    crossAxisAlignment: CrossAxisAlignment.start,
                    children: [
                      SizedBox(width: 110, child: Text(k, style: AppTextStyles.caption)),
                      Expanded(child: Text(v, style: AppTextStyles.body)),
                    ],
                  ),
                );
          }
