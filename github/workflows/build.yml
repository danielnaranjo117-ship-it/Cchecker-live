          import 'core.dart';
          import 'models.dart';

          final _sep = RegExp(r'[\s|,;:\t]+');

          List<int>? _date(String t) {
            final d = t.replaceAll(RegExp(r'\D'), '');
            if (d.length == 4) {
              final mm = int.parse(d.substring(0, 2));
              final yy = int.parse(d.substring(2));
              if (mm >= 1 && mm <= 12) return [mm, yy];
              return null;
            }
            if (d.length == 6) {
              final mm = int.parse(d.substring(0, 2));
              final yy = int.parse(d.substring(4));
              if (mm >= 1 && mm <= 12) return [mm, yy];
              return null;
            }
            if (d.length == 3) {
              final mm = int.parse(d.substring(0, 1));
              final yy = int.parse(d.substring(1));
              if (mm >= 1 && mm <= 9) return [mm, yy];
              return null;
            }
            if (d.length == 5) {
              final mm = int.parse(d.substring(0, 2));
              final yy = int.parse(d.substring(3));
              if (mm >= 1 && mm <= 12) return [mm, yy];
            }
            return null;
          }

          ImportResult parseCards(String input, {bool repairLuhn = true}) {
            final out = <CreditCard>[];
            final seen = <String>{};
            var dup = 0;
            var junk = 0;
            var fixed = 0;
            var exp = 0;

            for (final rawLine in input.split(RegExp(r'[\r\n]+'))) {
              final line = rawLine.trim();
              if (line.isEmpty) continue;

              final tok = line.split(_sep).where((s) => s.isNotEmpty).toList();
              if (tok.isEmpty) {
                junk++;
                continue;
              }

              String? pan;
              var panIdx = -1;
              for (var i = 0; i < tok.length; i++) {
                final d = tok[i].replaceAll(RegExp(r'\D'), '');
                if (d.length >= 12 && d.length <= 19) {
                  pan = d;
                  panIdx = i;
                  break;
                }
              }
              if (pan == null) {
                junk++;
                continue;
              }

              var mm = 0;
              var yy = 0;
              var cvv = '';

              for (var i = 0; i < tok.length; i++) {
                if (i == panIdx) continue;
                final t = tok[i];
                final d = t.replaceAll(RegExp(r'\D'), '');
                if (d.isEmpty) continue;

                if (mm == 0) {
                  final dt = _date(t);
                  if (dt != null) {
                    mm = dt[0];
                    yy = dt[1];
                    continue;
                  }
                }
                if (cvv.isEmpty && (d.length == 3 || d.length == 4)) cvv = d;
              }

              if (mm == 0 || yy == 0) {
                mm = 12;
                yy = 29;
              }

              if (repairLuhn && !luhn(pan)) {
                final f = fixLuhn(pan);
                if (f != pan) {
                  pan = f;
                  fixed++;
                }
              }

              if (seen.contains(pan)) {
                dup++;
                continue;
              }
              seen.add(pan);

              final card = CreditCard(
                id: newId(),
                pan: pan,
                expMonth: mm,
                expYear: yy,
                cvv: cvv,
                brand: schemeOf(pan),
                bin: pan.length >= 6 ? pan.substring(0, 6) : pan,
              );
              if (card.expired) exp++;
              out.add(card);
            }

            return ImportResult(cards: out, duplicates: dup, junk: junk, fixed: fixed, expired: exp);
          }
