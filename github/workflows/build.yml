            const ImportScreen({super.key});
            @override
            ConsumerState<ImportScreen> createState() => _ImportScreenState();
          }

          class _ImportScreenState extends ConsumerState<ImportScreen> {
            final _ctrl = TextEditingController();
            ImportResult? _res;
            bool _enrich = true;
            bool _repair = true;
            bool _busy = false;
            String _progress = '';

            @override
            void dispose() {
              _ctrl.dispose();
              super.dispose();
            }

            void _parse() => setState(() => _res = parseCards(_ctrl.text, repairLuhn: _repair));

            Future<void> _commit({required bool andRun}) async {
              final res = _res;
              if (res == null) return;

              setState(() {
                _busy = true;
                _progress = '';
              });

              await BinDb.i.loadIndex();

              var done = 0;
              final enriched = <CreditCard>[];

              for (final c in res.cards) {
                if (_enrich) {
                  final info = BinDb.i.lookup(c.pan);
                  enriched.add(
                    info == null
                        ? c
                        : c.copyWith(bank: info.bank, country: info.country, cardType: info.cardType, level: info.level),
                  );
                } else {
                  enriched.add(c);
                }
                done++;
                if (done % 25 == 0 && mounted) setState(() => _progress = '$done/${res.cards.length}');
              }

              await ref.read(cardsProvider.notifier).addAll(enriched);

              if (!mounted) return;
              setState(() {
                _busy = false;
                _progress = '';
                _ctrl.clear();
                _res = null;
              });

              ScaffoldMessenger.of(context).showSnackBar(
                SnackBar(content: Text('${res.cards.length} tarjetas agregadas')),
              );

              if (andRun) {
                ref.read(tabProvider.notifier).state = 0;
                await ref.read(runProvider.notifier).run(ids: enriched.map((c) => c.id).toList());
              }
            }

            @override
            Widget build(BuildContext context) {
              final res = _res;

              return ListView(
                padding: const EdgeInsets.all(16),
                children: [
                  const SectionHeader('Pega las lineas'),
                  GlassPanel(
                    child: TextField(
                      controller: _ctrl,
                      maxLines: 10,
                      style: AppTextStyles.mono,
                      decoration: const InputDecoration(
                        hintText: 'pan|mm|yy|cvv  ·  una por linea  ·  acepta barras, comas o espacios',
                        hintStyle: AppTextStyles.caption,
                        border: InputBorder.none,
                      ),
                    ),
                  ),
                  const SizedBox(height: 10),
                  GlassPanel(
                    padding: const EdgeInsets.symmetric(horizontal: 12),
                    child: Column(
                      children: [
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Completar datos del BIN', style: AppTextStyles.body),
                          subtitle: const Text('Banco, pais, tipo y nivel', style: AppTextStyles.caption),
                          value: _enrich,
                          activeColor: AppColors.lime,
                          onChanged: (v) => setState(() => _enrich = v),
                        ),
                        SwitchListTile(
                          contentPadding: EdgeInsets.zero,
                          title: const Text('Reparar digito de Luhn', style: AppTextStyles.body),
                          subtitle: const Text('Corrige numeros mal tipeados', style: AppTextStyles.caption),
                          value: _repair,
                          activeColor: AppColors.cyan,
                          onChanged: (v) => setState(() => _repair = v),
                        ),
                      ],
                    ),
                  ),
                  const SizedBox(height: 14),
                  Row(
                    children: [
                      NeonButton(label: 'Analizar', icon: Icons.search, onPressed: _busy ? null : _parse),
                      const SizedBox(width: 10),
                      NeonButton(
                        label: 'Limpiar',
                        color: AppColors.textMid,
                        onPressed: _busy
                            ? null
                            : () => setState(() {
                                  _ctrl.clear();
                                  _res = null;
                                }),
                      ),
                    ],
                  ),
                  if (res != null) ...[
                    const SectionHeader('Vista previa'),
                    GlassPanel(
                      child: Column(
                        crossAxisAlignment: CrossAxisAlignment.start,
                        children: [
                          Text(
                            '${fmtInt(res.cards.length)} validas',
                            style: const TextStyle(color: AppColors.lime, fontWeight: FontWeight.w700),
                          ),
                          const SizedBox(height: 6),
                          Text(
                            '${fmtInt(res.duplicates)} repetidas · ${fmtInt(res.junk)} basura · '
                            '${fmtInt(res.fixed)} reparadas · ${fmtInt(res.expired)} vencidas',
                            style: AppTextStyles.caption,
                          ),
                          const SizedBox(height: 12),
                          ...res.cards.take(12).map(
                                (c) => Padding(
                                  padding: const EdgeInsets.symmetric(vertical: 3),
                                  child: Text('${maskPan(c.pan)}  ${c.expLabel}  ${c.cvv}', style: AppTextStyles.mono),
                                ),
                              ),
                          if (res.cards.length > 12)
                            Text('y ${res.cards.length - 12} mas', style: AppTextStyles.caption),
                        ],
                      ),
                    ),
                    const SizedBox(height: 14),
                    NeonButton(
                      label: _busy ? 'Procesando $_progress' : 'Guardar ${fmtInt(res.cards.length)}',
                      icon: Icons.save_alt,
                      expand: true,
                      onPressed: res.cards.isEmpty || _busy ? null : () => _commit(andRun: false),
                    ),
                    const SizedBox(height: 10),
                    NeonButton(
                      label: 'Procesar masa',
                      icon: Icons.bolt,
                      color: AppColors.cyan,
                      expand: true,
                      onPressed: res.cards.isEmpty || _busy ? null : () => _commit(andRun: true),
                    ),
                  ],
                ],
              );
            }
          }
